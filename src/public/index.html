<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGR - Sistema de Gestión y Registro | Municipalidad de La Serena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/sgr.css">
</head>
<body class="bg-faro-login font-sans text-slate-800 min-h-screen flex flex-col">
  <header class="bg-muni-red text-white shadow-md border-b-4 border-amber-500">
    <div class="max-w-7xl mx-auto px-4 py-2.5 flex items-center space-x-3">
      <div class="bg-white px-3 py-1.5 rounded-lg shadow-sm flex items-center">
        <img src="/assets/horizontal-color.png" alt="Municipalidad de La Serena" class="h-9 md:h-10 w-auto object-contain" onerror="this.onerror=null;this.src='/assets/horizontal-color.svg';">
      </div>
      <div class="border-l border-white/30 pl-3"><p class="text-xs text-red-100 font-medium">Sistema de Gestión y Registro (SGR)</p></div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 flex items-center justify-center">
    <section class="max-w-md w-full bg-[#DB0032] text-white rounded-2xl shadow-2xl border border-red-400/30 p-8 my-auto" aria-labelledby="titulo">
      <div class="text-center mb-6">
        <img src="/assets/logo%20tinta.png" alt="Escudo de La Serena" class="h-28 w-auto mx-auto object-contain drop-shadow scale-125" onerror="this.onerror=null;this.src='/assets/logo-tinta.png';">
        <h1 id="titulo" class="text-2xl font-bold tracking-wide mt-2">Acceso Institucional</h1>
        <p class="text-xs text-red-100/90 mt-1">Ingrese sus credenciales del sistema SGR</p>
      </div>
      <form id="form-login" novalidate class="space-y-4">
        <div>
          <label for="correo" class="block text-xs font-semibold uppercase text-red-100 mb-1">Correo institucional o RUT</label>
          <input type="text" id="correo" class="campo" placeholder="usuario@laserena.cl" autocomplete="username" maxlength="150">
        </div>
        <div>
          <label for="password" class="block text-xs font-semibold uppercase text-red-100 mb-1">Contraseña</label>
          <div class="relative">
            <input type="password" id="password" class="campo pr-10" placeholder="••••••••" autocomplete="current-password" maxlength="100">
            <button type="button" id="ver" class="absolute inset-y-0 right-0 px-3 text-slate-500" aria-label="Mostrar u ocultar contraseña"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <button id="btn-login" type="submit" class="w-full bg-slate-900 hover:bg-slate-950 disabled:opacity-60 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> <span>Ingresar al sistema</span>
        </button>
        <div class="text-center"><a href="/recovery" class="text-xs text-red-100 underline hover:text-white">¿Olvidó su contraseña?</a></div>
      </form>
    </section>
  </main>

  <script src="/sgr.js"></script>
  <script>
    if (Sesion.token()) window.location.replace('/dashboard');

    const $ = id => document.getElementById(id);
    $('ver').addEventListener('click', () => {
      const campo = $('password');
      campo.type = campo.type === 'password' ? 'text' : 'password';
    });

    $('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      const correo = $('correo').value.trim();
      const password = $('password').value;
      if (!correo || !password) {
        aviso('warning', 'Campos obligatorios', 'Ingrese su correo (o RUT) y su contraseña.');
        return;
      }
      const boton = $('btn-login');
      boton.disabled = true;
      boton.querySelector('span').textContent = 'Verificando...';
      const r = await api('/auth/login', { method: 'POST', body: { correo, password }, sinRedirigir: true });
      boton.disabled = false;
      boton.querySelector('span').textContent = 'Ingresar al sistema';
      if (!r.ok) {
        aviso(r.status === 429 ? 'warning' : 'error', 'No se pudo ingresar', r.data.message || 'Error del servidor.');
        return;
      }
      if (!Sesion.guardar(r.data.token, r.data.user)) {
        aviso('error', 'Sesión no disponible', 'El navegador no permite guardar la sesión. Desactive el modo privado estricto e inténtelo de nuevo.');
        return;
      }
      window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
