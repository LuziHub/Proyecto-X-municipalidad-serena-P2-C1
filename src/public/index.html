<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGR - Sistema de Gestión y Registro | Municipalidad de La Serena</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para alertas interactivas institucionales -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos personalizados alineados a las normas gráficas de la Municipalidad de La Serena -->
    <style>
        .bg-faro-login {
            background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.65)), url('/assets/faro%20login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        /* Colores institucionales oficiales - Municipalidad de La Serena */
        .bg-muni-red { background-color: #C41230; } /* Rojo Heráldico */
        .hover\:bg-muni-red-dark:hover { background-color: #8B1D19; } /* Rojo Oscuro Institucional */
        .text-muni-red { color: #C41230; }
        .border-muni-red { border-color: #C41230; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- Header Institucional (Normas Gráficas La Serena) -->
    <header class="bg-muni-red text-white shadow-md border-b-4 border-amber-500">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex justify-between items-center">
            <!-- Logo oficial en tarjeta blanca -->
            <div class="flex items-center space-x-3">
                <div class="bg-white px-3 py-1.5 rounded-lg shadow-sm flex items-center">
                    <img src="/assets/horizontal-color.png" alt="Municipalidad de La Serena" class="h-9 md:h-10 w-auto object-contain" onError="this.onerror=null; this.src='/assets/horizontal-color.svg';">
                </div>
                <div class="border-l border-white/30 pl-3">
                    <p class="text-xs text-red-100 font-medium">Sistema de Gestión y Registro (SGR)</p>
                </div>
            </div>
            <div id="user-info" class="hidden flex items-center space-x-4">
                <span id="nav-username" class="text-sm font-medium bg-red-950/40 px-3 py-1 rounded-full border border-red-400/30"></span>
                <button onclick="cerrarSesion()" class="bg-slate-900/80 hover:bg-slate-900 text-white px-3 py-1.5 rounded text-sm transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Salir
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 flex items-center justify-center">

        <!-- VISTA 1: LOGIN (Estilo Rojo Institucional Unificado) -->
        <section id="view-login" class="max-w-md w-full bg-[#D60029] text-white backdrop-blur-md rounded-2xl shadow-2xl border border-red-400/30 p-8 my-auto">
            <div class="text-center mb-6">
                <!-- Escudo Oficial de La Serena directo sobre el fondo del mismo color -->
                <div class="inline-block p-1 mb-2">
                    <img src="/assets/logo%20tinta.png" alt="Escudo La Serena" class="h-28 w-auto mx-auto object-contain drop-shadow scale-125" onError="this.onerror=null; this.src='/assets/logo-tinta.png';">
                </div>
                <h2 class="text-2xl font-bold text-white tracking-wide mt-2">Acceso Institucional</h2>
                <p class="text-xs text-red-100/90 mt-1">Ingrese sus credenciales del sistema SGR</p>
            </div>
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-red-100 mb-1">Correo Institucional</label>
                    <input type="email" id="login-correo" placeholder="usuario@laserena.cl" required class="w-full px-3.5 py-2.5 bg-white text-slate-800 font-medium rounded-lg focus:ring-2 focus:ring-amber-400 outline-none shadow-inner border-0 placeholder:text-slate-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-red-100 mb-1">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" required class="w-full px-3.5 py-2.5 bg-white text-slate-800 font-medium rounded-lg focus:ring-2 focus:ring-amber-400 outline-none shadow-inner border-0 placeholder:text-slate-400">
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-950 text-white font-bold py-3 rounded-lg transition-all duration-200 shadow-lg border border-slate-700/50 mt-2 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Sistema
                </button>
            </form>
        </section>

        <!-- VISTA 2: PANEL DE CONTROL Y MANTENEDORES -->
        <section id="view-dashboard" class="hidden space-y-6 w-full">
            <!-- Navegación de Módulos -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-2 items-center justify-between">
                <div class="flex flex-wrap gap-2">
                    <button onclick="cambiarModulo('atenciones')" class="nav-btn bg-muni-red text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                        <i class="fa-solid fa-headset mr-1"></i> Atenciones Ciudadanas
                    </button>
                    <button onclick="cambiarModulo('delegaciones')" class="nav-btn bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">Delegaciones</button>
                    <button onclick="cambiarModulo('roles')" class="nav-btn bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">Roles</button>
                    <button onclick="cambiarModulo('usuarios')" class="nav-btn bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">Usuarios</button>
                    <button onclick="cambiarModulo('items-metas')" class="nav-btn bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">Ítems y Metas</button>
                    <button onclick="cambiarModulo('tipos-atencion')" class="nav-btn bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">Tipos Atención</button>
                    <button onclick="cambiarModulo('sub-atenciones')" class="nav-btn bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-2 rounded-lg text-sm font-medium transition">Sub-Atenciones</button>
                </div>
            </div>

            <!-- Contenido Dinámico del Módulo -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="modulo-titulo" class="text-xl font-bold text-slate-800">Gestión de Atenciones Ciudadanas</h3>
                    <button onclick="abrirModalCrear()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                        <i class="fa-solid fa-plus mr-1"></i> Nuevo Registro
                    </button>
                </div>

                <!-- Tabla de Datos -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse" id="tabla-datos">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                                <th class="p-3">ID / Código</th>
                                <th class="p-3">Detalle / Nombre</th>
                                <th class="p-3">Información Asociada</th>
                                <th class="p-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-datos" class="divide-y divide-slate-200 text-sm">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Modal Dinámico de Creación -->
    <div id="modal-crear" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6">
            <h3 id="modal-titulo" class="text-lg font-bold text-slate-900 mb-4">Agregar Nuevo Registro</h3>
            <form id="form-crear" onsubmit="guardarRegistro(event)" class="space-y-4">
                <div id="modal-inputs" class="space-y-3">
                    <!-- Inputs dinámicos -->
                </div>
                <div class="flex justify-end space-x-2 pt-3 border-t">
                    <button type="button" onclick="cerrarModalCrear()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-muni-red text-white rounded-lg text-sm">Guardar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Lógica Frontend -->
    <script>
        let moduloActual = 'atenciones';
        const API_URL = 'http://localhost:3000/api';

        document.addEventListener("DOMContentLoaded", () => {
            actualizarFondoLogin(true);
        });

        function actualizarFondoLogin(esLogin) {
            const body = document.body;
            if (esLogin) {
                body.classList.add('bg-faro-login');
            } else {
                body.classList.remove('bg-faro-login');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const correo = document.getElementById('login-correo').value.trim();
            const password = document.getElementById('login-password').value;

            // Validación estricta de dominios permitidos
            const regexDominios = /^[a-zA-Z0-9._%+-]+@(example\.test|laserena\.cl)$/;
            if (!regexDominios.test(correo)) {
                Swal.fire({
                    icon: 'error',
                    title: 'Dominio no autorizado',
                    text: 'Solo se permiten correos institucionales terminados en @example.test o @laserena.cl'
                });
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, password })
                });
                const data = await res.json();

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Bienvenido!',
                        text: `Sesión iniciada como ${data.user.nombre}`,
                        timer: 2000,
                        showConfirmButton: false
                    });
                    document.getElementById('view-login').classList.add('hidden');
                    document.getElementById('view-dashboard').classList.remove('hidden');
                    document.getElementById('user-info').classList.remove('hidden');
                    document.getElementById('nav-username').innerText = data.user.nombre;
                    
                    actualizarFondoLogin(false);
                    cargarDatosModulo();
                } else {
                    Swal.fire('Error de Acceso', data.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error de Conexión', 'No se pudo conectar con el servidor backend en Node.js.', 'error');
            }
        }

        function cerrarSesion() {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('user-info').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
            document.getElementById('form-login').reset();
            actualizarFondoLogin(true);
        }

        function cambiarModulo(modulo) {
            moduloActual = modulo;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-muni-red', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-700');
            });
            event.target.classList.remove('bg-slate-100', 'text-slate-700');
            event.target.classList.add('bg-muni-red', 'text-white');
            document.getElementById('modulo-titulo').innerText = `Gestión de ${event.target.innerText}`;
            cargarDatosModulo();
        }

        async function cargarDatosModulo() {
            try {
                const res = await fetch(`${API_URL}/${moduloActual}`);
                const json = await res.json();
                const tbody = document.getElementById('tbody-datos');
                tbody.innerHTML = '';

                if (json.data && json.data.length > 0) {
                    json.data.forEach(item => {
                        let tr = document.createElement('tr');
                        tr.className = 'hover:bg-slate-50 border-b border-slate-100';
                        tr.innerHTML = `
                            <td class="p-3 font-semibold text-red-800">${item.codigoAtencion || item.codigo || item.id}</td>
                            <td class="p-3">${item.nombre || item.ciudadano || item.periodo || 'N/A'}</td>
                            <td class="p-3 text-slate-600">${item.detalle || item.comunidades || item.descripcion || item.rol || 'Activo'}</td>
                            <td class="p-3 text-center">
                                <button onclick="eliminarRegistro('${moduloActual}', ${item.id})" class="bg-red-100 text-red-700 hover:bg-red-200 p-1.5 rounded text-xs transition">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400">No hay registros en este módulo.</td></tr>`;
                }
            } catch (err) {
                console.error(err);
            }
        }

        function abrirModalCrear() {
            const container = document.getElementById('modal-inputs');
            container.innerHTML = '';
            
            if (moduloActual === 'atenciones') {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-semibold mb-1">Nombre Ciudadano (Máx. 25 chars, sin números/símbolos)</label>
                        <input type="text" id="f-ciudadano" maxlength="25" oninput="validarTextoRestringido(this)" required class="w-full border p-2 rounded">
                    </div>
                    <div><label class="block text-xs font-semibold mb-1">Tipo de Atención</label><input type="text" id="f-tipo" maxlength="25" required class="w-full border p-2 rounded"></div>
                    <div><label class="block text-xs font-semibold mb-1">Detalle / Requerimiento</label><textarea id="f-detalle" required class="w-full border p-2 rounded"></textarea></div>
                `;
            } else {
                container.innerHTML = `
                    <div>
                        <label class="block text-xs font-semibold mb-1">Nombre / Código (Máx. 25 chars, sin números/símbolos)</label>
                        <input type="text" id="f-nombre" maxlength="25" oninput="validarTextoRestringido(this)" required class="w-full border p-2 rounded">
                    </div>
                    <div><label class="block text-xs font-semibold mb-1">Descripción / Detalle</label><input type="text" id="f-detalle" maxlength="25" required class="w-full border p-2 rounded"></div>
                `;
            }
            document.getElementById('modal-crear').classList.remove('hidden');
        }

        function validarTextoRestringido(input) {
            let valorLimpio = input.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '');
            if (valorLimpio.length > 25) {
                valorLimpio = valorLimpio.substring(0, 25);
            }
            input.value = valorLimpio;
        }

        function cerrarModalCrear() {
            document.getElementById('modal-crear').classList.add('hidden');
        }

        async function guardarRegistro(e) {
            e.preventDefault();
            let bodyData = {};
            let campoTexto = '';

            if (moduloActual === 'atenciones') {
                campoTexto = document.getElementById('f-ciudadano').value;
                bodyData = {
                    ciudadano: campoTexto,
                    tipo: document.getElementById('f-tipo').value,
                    detalle: document.getElementById('f-detalle').value
                };
            } else {
                campoTexto = document.getElementById('f-nombre').value;
                bodyData = {
                    nombre: campoTexto,
                    detalle: document.getElementById('f-detalle').value
                };
            }

            const regexSoloLetras = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]*$/;
            if (!regexSoloLetras.test(campoTexto)) {
                Swal.fire({
                    icon: 'error',
                    title: 'Caracteres no válidos',
                    text: 'Error: Has ingresado números o símbolos especiales. Solo se permiten letras y espacios.'
                });
                return;
            }

            if (campoTexto.length > 25) {
                Swal.fire({
                    icon: 'error',
                    title: 'Límite excedido',
                    text: `Error: El texto ingresado tiene ${campoTexto.length} caracteres. El máximo permitido es 25.`
                });
                return;
            }

            try {
                const res = await fetch(`${API_URL}/${moduloActual}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                const json = await res.json();

                if (res.ok) {
                    cerrarModalCrear();
                    Swal.fire('¡Éxito!', 'Registro guardado correctamente.', 'success');
                    cargarDatosModulo();
                } else {
                    Swal.fire('Error de Validación', json.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
            }
        }

        async function eliminarRegistro(modulo, id) {
            const confirm = await Swal.fire({
                title: '¿Estás seguro?',
                text: "Esta acción eliminará el registro del sistema.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#C41230',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, eliminar'
            });

            if (confirm.isConfirmed) {
                try {
                    await fetch(`${API_URL}/${modulo}/${id}`, { method: 'DELETE' });
                    Swal.fire('Eliminado', 'El registro ha sido eliminado.', 'success');
                    cargarDatosModulo();
                } catch (err) {
                    Swal.fire('Error', 'No se pudo eliminar el registro.', 'error');
                }
            }
        }
    </script>
</body>
</html>
