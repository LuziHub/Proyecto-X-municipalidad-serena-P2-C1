<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de Contraseña - SGR La Serena</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-faro-login {
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('/assets/faro%20login.jpg');
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .bg-muni-red { background-color: #C41230; }
        .text-muni-red { color: #C41230; }
        .border-muni-red { border-color: #C41230; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex items-center justify-center bg-faro-login p-4">

    <!-- Contenedor Principal de Recuperación -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border-t-4 border-[#C41230]">
        
        <!-- Cabecera del Formulario -->
        <div class="text-center mb-6">
            <img src="/assets/logo%20tinta.png" alt="Logo La Serena" class="h-20 mx-auto object-contain mb-2" onError="this.onerror=null; this.src='/assets/logo-tinta.png';">
            <h2 class="text-xl font-bold text-slate-900 tracking-wide">Recuperación de Acceso SGR</h2>
            <p class="text-xs text-slate-500 mt-1">Municipalidad de La Serena</p>
        </div>

        <!-- PASO 1: Solicitar Código -->
        <div id="step-1" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Correo Institucional</label>
                <input type="email" id="correo-rec" placeholder="usuario@laserena.cl" class="w-full px-3.5 py-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#C41230]">
            </div>
            <button onclick="enviarCodigo()" class="w-full bg-[#C41230] hover:bg-red-800 text-white font-bold py-2.5 rounded-lg text-sm transition-all duration-200 shadow-md">
                Solicitar Código (6 dígitos)
            </button>
        </div>

        <!-- PASO 2: Validar Código de 6 dígitos y Nueva Contraseña -->
        <div id="step-2" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Código de Verificación (6 dígitos)</label>
                <input type="text" id="codigo-verificacion" maxlength="6" placeholder="123456" class="w-full px-3.5 py-2.5 border rounded-lg text-center tracking-widest text-xl font-bold outline-none focus:ring-2 focus:ring-[#C41230]">
                <p class="text-[10px] text-slate-400 mt-1 text-center">Puede pegar el código directamente en el campo.</p>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nueva Contraseña</label>
                <input type="password" id="nueva-pass" placeholder="••••••••" class="w-full px-3.5 py-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-[#C41230]">
                <p class="text-[10px] text-slate-500 mt-1">Requisitos: Mínimo 8 caracteres, al menos una letra y un número.</p>
            </div>
            <button onclick="validarYActualizar()" class="w-full bg-[#C41230] hover:bg-red-800 text-white font-bold py-2.5 rounded-lg text-sm transition-all duration-200 shadow-md">
                Actualizar Contraseña
            </button>
        </div>

        <!-- Enlace de Retorno al Login -->
        <div class="text-center mt-6 pt-4 border-t border-slate-100">
            <a href="/" class="text-xs text-[#C41230] hover:underline font-medium inline-flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Volver al Login
            </a>
        </div>
    </div>

    <!-- Script de Lógica del Flujo de Recuperación -->
    <script>
        const API_URL = 'http://localhost:3000/api';

        async function enviarCodigo() {
            const correo = document.getElementById('correo-rec').value.trim();
            if (!correo) {
                Swal.fire('Atención', 'Ingrese su correo institucional.', 'warning');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo })
                });
                const data = await res.json();
                
                Swal.fire('Información', data.message, 'info');
                document.getElementById('step-1').classList.add('hidden');
                document.getElementById('step-2').classList.remove('hidden');
            } catch (err) {
                Swal.fire('Error', 'No se pudo conectar con el servidor.', 'error');
            }
        }

        async function validarYActualizar() {
            const correo = document.getElementById('correo-rec').value.trim();
            const codigo = document.getElementById('codigo-verificacion').value.trim();
            const nuevaPassword = document.getElementById('nueva-pass').value;

            try {
                const res = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, codigo, nuevaPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Éxito!',
                        text: data.message,
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = '/';
                    });
                } else {
                    Swal.fire('Error de Validación', data.message, 'error');
                }
            } catch (err) {
                Swal.fire('Error', 'No se pudo procesar la solicitud.', 'error');
            }
        }
    </script>
</body>
</html>
