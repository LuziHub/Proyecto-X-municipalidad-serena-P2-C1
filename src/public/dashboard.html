<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel SGR | Municipalidad de La Serena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/sgr.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">
  <header class="bg-muni-red text-white shadow-md border-b-4 border-amber-500">
    <div class="px-4 py-2.5 flex flex-wrap items-center gap-3">
      <div class="bg-white px-3 py-1.5 rounded-lg"><img src="/assets/horizontal-color.png" alt="Municipalidad de La Serena" class="h-9 w-auto" onerror="this.onerror=null;this.src='/assets/horizontal-color.svg';"></div>
      <p class="text-xs text-red-100 font-medium border-l border-white/30 pl-3 hidden sm:block">Sistema de Gestión y Registro (SGR)</p>
      <div class="ml-auto flex flex-wrap items-center gap-3">
        <div id="insignia" class="flex items-center gap-2 bg-white/15 border border-white/30 rounded-lg px-3 py-1.5 text-sm" title="Delegación en la que estás operando">
          <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
          <span class="sr-only">Delegación activa:</span>
          <strong id="del-nombre">—</strong>
          <select id="del-selector" class="hidden text-slate-800 rounded px-1 py-0.5 text-xs" aria-label="Cambiar de delegación"></select>
        </div>
        <div class="text-right leading-tight text-xs">
          <div class="font-bold" id="u-nombre"></div>
          <div class="text-red-100" id="u-rol"></div>
        </div>
        <button id="salir" class="btn btn-sec !py-1.5"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
      </div>
    </div>
  </header>

  <div class="flex flex-1 flex-col md:flex-row">
    <nav id="menu" class="md:w-60 bg-white border-r border-slate-200 p-3 flex md:flex-col gap-1 overflow-x-auto" aria-label="Módulos"></nav>
    <main id="contenido" class="flex-1 p-4 md:p-6 min-w-0" aria-live="polite"></main>
  </div>

  <script src="/sgr.js"></script>
  <script>
  const $ = id => document.getElementById(id);
  let usuario = Sesion.usuario();
  if (!Sesion.token() || !usuario) window.location.replace('/');

  // ── Definición de pantallas (qué columnas y campos tiene cada módulo) ──────
  const ESTADOS_ACTIVO = ['Activo', 'Inactivo'], ESTADOS_ACTIVA = ['Activa', 'Inactiva'];
  const MODULOS = {
    'atenciones': { etiqueta: 'Atenciones', icono: 'fa-clipboard-list', singular: 'atención',
      columnas: [['identificador_atencion', 'Identificador'], ['fecha_registro', 'Fecha', 'fecha'], ['solicitante', 'Solicitante'], ['tipo', 'Tipo'], ['sub_atencion', 'Sub atención'], ['delegacion_codigo', 'Delegación'], ['responsable', 'Responsable']],
      campos: [] },
    'delegaciones': { etiqueta: 'Delegaciones', icono: 'fa-building-columns', singular: 'delegación', estados: ESTADOS_ACTIVA,
      columnas: [['codigo', 'Código'], ['nombre', 'Nombre'], ['direccion', 'Dirección'], ['comuna', 'Comuna'], ['estado', 'Estado', 'estado']],
      campos: [{ k: 'codigo', l: 'Código', max: 10, req: 1 }, { k: 'nombre', l: 'Nombre', max: 100, req: 1 }, { k: 'direccion', l: 'Dirección', max: 255, req: 1 }, { k: 'comuna', l: 'Comuna', max: 100, def: 'La Serena' }, { k: 'estado', l: 'Estado', t: 'sel', op: ESTADOS_ACTIVA, def: 'Activa' }] },
    'roles': { etiqueta: 'Roles', icono: 'fa-user-shield', singular: 'rol', estados: ESTADOS_ACTIVO,
      columnas: [['codigo', 'Código'], ['nombre', 'Nombre'], ['descripcion', 'Descripción'], ['alcance', 'Alcance'], ['estado', 'Estado', 'estado']],
      campos: [{ k: 'codigo', l: 'Código', max: 10, req: 1 }, { k: 'nombre', l: 'Nombre', max: 50, req: 1 }, { k: 'descripcion', l: 'Descripción', max: 255 },
        { k: 'alcance', l: 'Alcance', t: 'sel', op: [], def: 'Delegación' }, { k: 'estado', l: 'Estado', t: 'sel', op: ESTADOS_ACTIVO, def: 'Activo' }, { k: 'permisos', l: 'Permisos', t: 'permisos' }] },
    'usuarios': { etiqueta: 'Usuarios', icono: 'fa-users', singular: 'usuario', estados: ESTADOS_ACTIVO,
      columnas: [['nombre', 'Nombre'], ['correo', 'Correo'], ['rut', 'RUT'], ['rol', 'Rol'], ['delegacion_codigo', 'Delegación'], ['estado', 'Estado', 'estado']],
      campos: [{ k: 'nombre', l: 'Nombre completo', max: 150, req: 1 }, { k: 'correo', l: 'Correo', max: 150, req: 1, tipo: 'email' }, { k: 'rut', l: 'RUT (opcional)', max: 12, ph: '12345678-5' },
        { k: 'id_rol', l: 'Rol', t: 'sel', lookup: 'roles', req: 1 }, { k: 'id_delegacion_activa', l: 'Delegación principal', t: 'sel', lookup: 'delegaciones', req: 1 },
        { k: 'delegaciones', l: 'Delegaciones autorizadas', t: 'multi' },
        { k: 'password', l: 'Contraseña', t: 'clave' }, { k: 'estado', l: 'Estado', t: 'sel', op: ESTADOS_ACTIVO, def: 'Activo' }] },
    'items-metas': { etiqueta: 'Ítems y metas', icono: 'fa-bullseye', singular: 'ítem', estados: ESTADOS_ACTIVO,
      columnas: [['codigo', 'Código'], ['nombre', 'Nombre'], ['descripcion', 'Descripción'], ['estado', 'Estado', 'estado']],
      campos: [{ k: 'codigo', l: 'Código', max: 10, req: 1 }, { k: 'nombre', l: 'Nombre', max: 100, req: 1 }, { k: 'descripcion', l: 'Descripción', max: 255, req: 1, t: 'area' }, { k: 'estado', l: 'Estado', t: 'sel', op: ESTADOS_ACTIVO, def: 'Activo' }] },
    'tipos-atencion': { etiqueta: 'Tipo de Atención', icono: 'fa-tags', singular: 'tipo de atención', estados: ESTADOS_ACTIVO,
      columnas: [['codigo', 'Código'], ['nombre', 'Nombre'], ['descripcion', 'Descripción'], ['estado', 'Estado', 'estado']],
      campos: [{ k: 'codigo', l: 'Código', max: 10, req: 1 }, { k: 'nombre', l: 'Nombre', max: 100, req: 1 }, { k: 'descripcion', l: 'Descripción', max: 255, req: 1, t: 'area' }, { k: 'estado', l: 'Estado', t: 'sel', op: ESTADOS_ACTIVO, def: 'Activo' }] },
    'sub-atenciones': { etiqueta: 'Sub Atención', icono: 'fa-sitemap', singular: 'sub atención', estados: ESTADOS_ACTIVA,
      columnas: [['codigo', 'Código'], ['nombre', 'Nombre'], ['tipo', 'Tipo de Atención'], ['estado', 'Estado', 'estado']],
      campos: [{ k: 'codigo', l: 'Código', max: 10, req: 1 }, { k: 'nombre', l: 'Nombre', max: 100, req: 1 }, { k: 'id_tipo', l: 'Tipo de Atención', t: 'sel', lookup: 'tipos', req: 1 }, { k: 'estado', l: 'Estado', t: 'sel', op: ESTADOS_ACTIVA, def: 'Activa' }] }
  };
  const ORDEN = ['atenciones', 'delegaciones', 'roles', 'usuarios', 'items-metas', 'tipos-atencion', 'sub-atenciones'];

  // Campos que muestra la vista de consulta ("Ver") de cada módulo.
  const VER = {
    'atenciones': [['identificador_atencion', 'Identificador'], ['fecha_registro', 'Fecha y hora de registro', 'fecha'], ['solicitante', 'Solicitante'], ['tipo', 'Tipo de atención'], ['sub_atencion', 'Sub atención'], ['descripcion', 'Descripción'], ['delegacion', 'Delegación'], ['responsable', 'Responsable']],
    'delegaciones': [['codigo', 'Código'], ['nombre', 'Nombre'], ['direccion', 'Dirección'], ['comuna', 'Comuna'], ['estado', 'Estado'], ['created_at', 'Creada', 'fecha']],
    'roles': [['codigo', 'Código'], ['nombre', 'Nombre'], ['descripcion', 'Descripción'], ['alcance', 'Alcance'], ['estado', 'Estado'], ['permisos', 'Permisos', 'permisos']],
    'usuarios': [['nombre', 'Nombre'], ['correo', 'Correo'], ['rut', 'RUT'], ['rol', 'Rol'], ['delegacion', 'Delegación principal'], ['delegaciones', 'Delegaciones autorizadas', 'delegaciones'], ['estado', 'Estado'], ['ultimo_ingreso', 'Último ingreso', 'fecha']],
    'items-metas': [['codigo', 'Código'], ['nombre', 'Nombre'], ['descripcion', 'Descripción'], ['estado', 'Estado']],
    'tipos-atencion': [['codigo', 'Código'], ['nombre', 'Nombre'], ['descripcion', 'Descripción'], ['estado', 'Estado']],
    'sub-atenciones': [['codigo', 'Código'], ['nombre', 'Nombre'], ['tipo', 'Tipo de Atención'], ['estado', 'Estado']]
  };

  // Módulos que en esta entrega son solo plantilla: navegación y vista por rol, sin lógica (datos ilustrativos).
  const PLANTILLAS = {
    'vecinos': { icono: 'fa-people-roof', titulo: 'Vecinos', texto: 'Catálogo de vecinos para identificar al solicitante de una atención.',
      cols: ['RUT', 'Nombre', 'Comuna', 'Teléfono'], filas: [['11.111.111-1', 'Persona de ejemplo A', 'La Serena', '+56 9 0000 0001'], ['22.222.222-2', 'Persona de ejemplo B', 'La Serena', '+56 9 0000 0002'], ['33.333.333-3', 'Persona de ejemplo C', 'La Serena', '+56 9 0000 0003']] },
    'tipos-gestion': { icono: 'fa-list-check', titulo: 'Tipo de Gestión', texto: 'Clasificación de las gestiones que se realizan sobre una atención.',
      cols: ['Código', 'Nombre', 'Descripción', 'Estado'], filas: [['TG01', 'Derivación', 'Deriva a otra unidad', 'Activo'], ['TG02', 'Seguimiento', 'Control posterior', 'Activo'], ['TG03', 'Cierre', 'Finaliza la gestión', 'Inactivo']] },
    'verificacion': { icono: 'fa-clipboard-check', titulo: 'Verificación de evidencias', texto: 'Revisión y validación de las evidencias adjuntas a las atenciones.',
      cols: ['Folio', 'Atención', 'Evidencia', 'Estado de verificación'], filas: [['VER-001', 'ATC-0000-000001', 'Fotografía', 'Pendiente'], ['VER-002', 'ATC-0000-000002', 'Documento', 'Verificada'], ['VER-003', 'ATC-0000-000003', 'Fotografía', 'Observada']] },
    'alertas': { icono: 'fa-bell', titulo: 'Alertas', texto: 'Avisos institucionales y de trazabilidad del sistema.',
      cols: ['Fecha', 'Tipo', 'Mensaje', 'Prioridad'], filas: [['01-01-2000 10:00', 'Plazo', 'Atención próxima a vencer (ejemplo)', 'Alta'], ['01-01-2000 11:30', 'Sistema', 'Evidencia sin verificar (ejemplo)', 'Media'], ['01-01-2000 12:15', 'Aviso', 'Nueva delegación habilitada (ejemplo)', 'Baja']] },
    'reportes': { icono: 'fa-chart-column', titulo: 'Reportes', texto: 'Indicadores y resúmenes de la gestión municipal.',
      cols: ['Indicador', 'Periodo', 'Valor', 'Variación'], filas: [['Atenciones registradas', 'Mes de ejemplo', '000', '+0 %'], ['Atenciones cerradas', 'Mes de ejemplo', '000', '+0 %'], ['Tiempo medio de respuesta', 'Mes de ejemplo', '0 días', '0 %']] }
  };

  const puede = (m, a) => !!(usuario.permisos && usuario.permisos[m] && usuario.permisos[m].includes(a));
  let config = { modulos: {}, acciones: [], alcances: [] };
  let actual = null, vista = 'lista', estadoLista = { page: 1, search: '', estado: '' }, sucio = false;

  // ── Cabecera: insignia de delegación, usuario, salir ───────────────────────
  function pintarCabecera() {
    $('u-nombre').textContent = usuario.nombre;
    $('u-rol').textContent = `${usuario.rol} · alcance ${usuario.alcance}`;
    const act = usuario.delegacionActiva;
    $('del-nombre').textContent = act ? `${act.codigo ? act.codigo + ' · ' : ''}${act.nombre}` : 'Sin delegación';
    const sel = $('del-selector');
    if (usuario.delegaciones.length > 1) {
      sel.classList.remove('hidden'); $('del-nombre').classList.add('hidden');
      sel.innerHTML = usuario.delegaciones.map(d => `<option value="${d.id}" ${act && act.id === d.id ? 'selected' : ''}>${esc(d.codigo ? d.codigo + ' · ' : '')}${esc(d.nombre)}</option>`).join('');
    } else { sel.classList.add('hidden'); $('del-nombre').classList.remove('hidden'); }
  }
  $('del-selector').addEventListener('change', async e => {
    const nueva = Number(e.target.value);
    const previa = usuario.delegacionActiva.id;
    if (sucio) {
      const c = await Swal.fire({ icon: 'warning', title: 'Cambios sin guardar', text: 'Si cambias de delegación se perderá lo que estás escribiendo.', showCancelButton: true, confirmButtonText: 'Cambiar', cancelButtonText: 'Seguir aquí', confirmButtonColor: '#DB0032' });
      if (!c.isConfirmed) { e.target.value = previa; return; }
    }
    const r = await api('/auth/delegacion', { method: 'POST', body: { id: nueva } });
    if (!r.ok) { aviso('error', 'No se pudo cambiar', r.data.message); e.target.value = previa; return; }
    Sesion.fijarDelegacion(nueva);
    usuario.delegacionActiva = usuario.delegaciones.find(d => d.id === nueva);
    Sesion.actualizarUsuario(usuario);
    sucio = false; pintarCabecera();
    toast('success', `Delegación activa: ${usuario.delegacionActiva.nombre}`);
    abrir(actual || primero());
  });
  $('salir').addEventListener('click', async () => {
    if (sucio) {
      const c = await Swal.fire({ icon: 'warning', title: 'Cambios sin guardar', text: 'Si cierras la sesión se perderá lo que estás escribiendo.', showCancelButton: true, confirmButtonText: 'Cerrar sesión', cancelButtonText: 'Quedarme', confirmButtonColor: '#DB0032' });
      if (!c.isConfirmed) return;
    }
    sucio = false;
    await api('/auth/logout', { method: 'POST', sinRedirigir: true });   // invalida el token en el servidor
    Sesion.cerrar();
    window.location.replace('/');
  });

  // ── Menú según permisos ────────────────────────────────────────────────────
  function primero() { return 'inicio'; }
  function pintarMenu() {
    const item = ([id, t, ic]) => `<button data-mod="${id}" class="menu-item text-left whitespace-nowrap px-3 py-2 rounded-lg text-sm font-semibold hover:bg-slate-100"><i class="fa-solid ${ic} w-5" aria-hidden="true"></i> ${esc(t)}</button>`;
    const items = [['inicio', 'Inicio', 'fa-house']];
    if (puede('atenciones', 'crear')) items.push(['ingreso', 'Ingreso de atención', 'fa-pen-to-square']);
    ORDEN.filter(m => puede(m, 'ver')).forEach(m => items.push([m, MODULOS[m].etiqueta, MODULOS[m].icono]));
    const extra = Object.keys(PLANTILLAS).filter(m => puede(m, 'ver')).map(m => [m, PLANTILLAS[m].titulo, PLANTILLAS[m].icono]);
    $('menu').innerHTML = items.map(item).join('') +
      (extra.length ? `<p class="hidden md:block text-[11px] uppercase font-bold text-slate-500 px-3 pt-3">Otros módulos (plantilla)</p>` + extra.map(item).join('') : '');
    document.querySelectorAll('.menu-item').forEach(b => b.addEventListener('click', () => abrir(b.dataset.mod)));
  }
  function marcarMenu(id) {
    document.querySelectorAll('.menu-item').forEach(b => {
      const on = b.dataset.mod === id;
      b.classList.toggle('bg-red-50', on); b.classList.toggle('text-red-700', on);
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  async function abrir(id) {
    if (!id) id = 'inicio';
    if (id !== 'inicio' && id !== 'ingreso' && !PLANTILLAS[id] && !puede(id, 'ver')) id = 'inicio';
    if (sucio) {
      const c = await Swal.fire({ icon: 'warning', title: 'Cambios sin guardar', text: '¿Salir de esta pantalla sin guardar?', showCancelButton: true, confirmButtonText: 'Salir', cancelButtonText: 'Quedarme', confirmButtonColor: '#DB0032' });
      if (!c.isConfirmed) return;
      sucio = false;
    }
    actual = id; marcarMenu(id);
    if (id === 'inicio') return pantallaInicio();
    if (id === 'ingreso') return pantallaIngreso();
    if (PLANTILLAS[id]) return pantallaPlantilla(id);
    estadoLista = { page: 1, search: '', estado: '' };
    listar();
  }

  // ── Listado ────────────────────────────────────────────────────────────────
  function celda(v, tipo) {
    if (tipo === 'estado') return `<span class="pastilla ${['Activo', 'Activa'].includes(v) ? 'p-ok' : 'p-off'}">${esc(v)}</span>`;
    if (tipo === 'fecha') return esc(fechaHora(v));
    return esc(v === null || v === undefined || v === '' ? '—' : v);
  }

  async function listar() {
    const m = MODULOS[actual];
    const cont = $('contenido');
    cont.innerHTML = `
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <h1 class="text-xl font-bold mr-auto"><i class="fa-solid ${m.icono} text-red-700" aria-hidden="true"></i> ${esc(m.etiqueta)}</h1>
        ${puede(actual, 'exportar') ? '<button id="exportar" class="btn btn-sec"><i class="fa-solid fa-file-excel text-green-700"></i> Exportar a Excel</button>' : ''}
        ${actual === 'atenciones' ? '' : (puede(actual, 'crear') ? `<button id="nuevo" class="btn btn-primario"><i class="fa-solid fa-plus"></i> Nuevo</button>` : '')}
        ${actual === 'atenciones' && puede('atenciones', 'crear') ? '<button id="nuevo" class="btn btn-primario"><i class="fa-solid fa-plus"></i> Registrar atención</button>' : ''}
      </div>
      <div class="flex flex-wrap gap-2 mb-3">
        <input id="buscar" class="campo !w-64" placeholder="Buscar..." maxlength="100" value="${esc(estadoLista.search)}" aria-label="Buscar">
        ${m.estados ? `<select id="f-estado" class="campo !w-40" aria-label="Filtrar por estado"><option value="">Todos los estados</option>${m.estados.map(e => `<option ${estadoLista.estado === e ? 'selected' : ''}>${e}</option>`).join('')}</select>` : ''}
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"><div id="tabla" class="p-6 text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</div></div>
      <div id="pag" class="flex items-center justify-between mt-3 text-sm"></div>`;

    let t;
    $('buscar').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { estadoLista.search = e.target.value.trim(); estadoLista.page = 1; cargarFilas(); }, 350); });
    if ($('f-estado')) $('f-estado').addEventListener('change', e => { estadoLista.estado = e.target.value; estadoLista.page = 1; cargarFilas(); });
    if ($('nuevo')) $('nuevo').addEventListener('click', () => (actual === 'atenciones' ? abrir('ingreso') : formulario(null)));
    if ($('exportar')) $('exportar').addEventListener('click', exportar);
    cargarFilas();
  }

  async function cargarFilas() {
    const m = MODULOS[actual], modulo = actual;
    const q = new URLSearchParams({ page: estadoLista.page, limit: 10 });
    if (estadoLista.search) q.set('search', estadoLista.search);
    if (estadoLista.estado) q.set('estado', estadoLista.estado);
    const r = await api(`/${modulo}?${q}`);
    if (modulo !== actual || !$('tabla')) return;
    if (!r.ok) { $('tabla').innerHTML = `<p class="text-red-700"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(r.data.message || 'No se pudo cargar.')}</p>`; $('pag').innerHTML = ''; return; }
    const filas = r.data.data, p = r.data.pagination;
    if (!filas.length) {
      const filtrado = !!(estadoLista.search || estadoLista.estado);
      $('tabla').innerHTML = filtrado
        ? `<p class="text-slate-600 p-2"><i class="fa-solid fa-magnifying-glass"></i> Sin coincidencias${estadoLista.search ? ` para «${esc(estadoLista.search)}»` : ''}. Prueba con otros términos o quita los filtros.</p><button id="quitar-filtros" class="btn btn-sec mt-2">Quitar filtros</button>`
        : '<p class="text-slate-500 p-2"><i class="fa-regular fa-folder-open"></i> Aún no hay registros en este módulo.</p>';
      $('pag').innerHTML = '';
      if ($('quitar-filtros')) $('quitar-filtros').addEventListener('click', () => { estadoLista = { page: 1, search: '', estado: '' }; listar(); });
      return;
    }
    const acciones = true;
    $('tabla').className = '';
    $('tabla').innerHTML = `<table class="tabla w-full"><thead><tr>${m.columnas.map(c => `<th scope="col">${esc(c[1])}</th>`).join('')}${acciones ? '<th scope="col">Acciones</th>' : ''}</tr></thead><tbody>
      ${filas.map(f => `<tr>${m.columnas.map(c => `<td>${celda(f[c[0]], c[2])}</td>`).join('')}${acciones ? `<td class="whitespace-nowrap">
        <button class="btn btn-sec !py-1" data-ver="${f.id}" aria-label="Ver ${esc(f.nombre || f.identificador_atencion || f.correo || '')}"><i class="fa-regular fa-eye"></i> Ver</button>
        ${puede(modulo, 'editar') && modulo !== 'atenciones' ? `<button class="btn btn-sec !py-1" data-edit="${f.id}" aria-label="Editar ${esc(f.nombre || f.correo || '')}"><i class="fa-solid fa-pen"></i> Editar</button>` : ''}
        ${puede(modulo, 'eliminar') ? `<button class="btn btn-sec !py-1 text-red-700" data-del="${f.id}" aria-label="Eliminar ${esc(f.nombre || f.identificador_atencion || f.correo || '')}"><i class="fa-solid fa-trash"></i> Eliminar</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table>`;
    $('tabla').querySelectorAll('[data-ver]').forEach(b => b.addEventListener('click', () => detalle(b.dataset.ver)));
    $('tabla').querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => formulario(b.dataset.edit)));
    $('tabla').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => eliminar(b.dataset.del, filas.find(f => String(f.id) === b.dataset.del))));
    $('pag').innerHTML = `<span class="text-slate-600">${p.total} registro(s) · página ${p.page} de ${p.totalPages}</span>
      <span class="flex gap-2"><button class="btn btn-sec" id="ant" ${p.page <= 1 ? 'disabled' : ''}>Anterior</button><button class="btn btn-sec" id="sig" ${p.page >= p.totalPages ? 'disabled' : ''}>Siguiente</button></span>`;
    $('ant').addEventListener('click', () => { estadoLista.page -= 1; cargarFilas(); });
    $('sig').addEventListener('click', () => { estadoLista.page += 1; cargarFilas(); });
  }

  async function exportar() {
    const b = $('exportar'); b.disabled = true;
    try {
      const q = new URLSearchParams();
      if (estadoLista.search) q.set('search', estadoLista.search);
      if (estadoLista.estado) q.set('estado', estadoLista.estado);
      const r = await fetch(`${API_URL}/${actual}/export?${q}`, { headers: { Authorization: `Bearer ${Sesion.token()}`, 'X-Delegacion': Sesion.delegacion() || '' } });
      if (!r.ok) { const d = await r.json().catch(() => ({})); aviso(r.status === 404 ? 'info' : 'error', r.status === 404 ? 'Sin datos' : 'No se pudo exportar', d.message || 'Error del servidor.'); return; }
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `${actual}_${new Date().toISOString().slice(0, 10)}.xlsx`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
      toast('success', 'Archivo Excel generado');
    } finally { b.disabled = false; }
  }

  async function eliminar(id, fila) {
    const m = MODULOS[actual];
    const nombre = fila.nombre || fila.identificador_atencion || fila.correo || `#${id}`;
    const c = await Swal.fire({ icon: 'warning', title: `¿Eliminar ${m.singular}?`, text: nombre, showCancelButton: true, confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar', confirmButtonColor: '#DB0032' });
    if (!c.isConfirmed) return;
    const r = await api(`/${actual}/${id}`, { method: 'DELETE' });
    if (r.ok) { toast('success', 'Registro eliminado'); return cargarFilas(); }
    if (r.status === 409 && r.data.puedeDesactivar) {
      const d = await Swal.fire({ icon: 'info', title: 'No se puede eliminar', text: r.data.message, showCancelButton: true, confirmButtonText: 'Desactivar', cancelButtonText: 'Cancelar', confirmButtonColor: '#DB0032' });
      if (d.isConfirmed) {
        const inactivo = m.estados[1];
        const u = await api(`/${actual}/${id}`, { method: 'PUT', body: { estado: inactivo } });
        if (u.ok) { toast('success', 'Registro desactivado'); cargarFilas(); } else aviso('error', 'No se pudo desactivar', u.data.message);
      }
      return;
    }
    aviso(r.status === 403 ? 'warning' : 'error', 'No se pudo eliminar', r.data.message || 'Error del servidor.');
  }

  // ── Formularios ────────────────────────────────────────────────────────────
  const cache = {};
  async function lookup(nombre) {
    if (nombre === 'delegaciones') return usuario.delegaciones.map(d => ({ id: d.id, nombre: `${d.codigo} · ${d.nombre}` }));
    if (cache[nombre]) return cache[nombre];
    const r = await api(`/lookup/${nombre}`);
    if (r.ok) cache[nombre] = r.data.data;
    return r.ok ? r.data.data : [];
  }
  const delegacionesPermitidas = () => usuario.delegaciones;

  function matrizPermisos(valor) {
    const mios = usuario.permisos || {};
    const nombres = config.modulos;
    const acciones = config.acciones;
    return `<div class="overflow-x-auto border border-slate-200 rounded-lg"><table class="tabla w-full"><thead><tr><th>Módulo</th>${acciones.map(a => `<th class="text-center">${esc(a)}</th>`).join('')}</tr></thead><tbody>
      ${Object.keys(nombres).map(mod => `<tr><td>${esc(nombres[mod])}</td>${acciones.map(a => {
        const tengo = (mios[mod] || []).includes(a), marcado = (valor[mod] || []).includes(a);
        return `<td class="text-center"><input type="checkbox" data-mod="${mod}" data-acc="${a}" ${marcado ? 'checked' : ''} ${tengo ? '' : 'disabled'} aria-label="${esc(nombres[mod])}: ${a}" ${tengo ? '' : 'title="No puedes otorgar un permiso que no tienes"'}></td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  function leerPermisos(raiz) {
    const p = {};
    raiz.querySelectorAll('input[data-mod]:checked').forEach(i => { (p[i.dataset.mod] = p[i.dataset.mod] || []).push(i.dataset.acc); });
    return p;
  }

  async function formulario(id) {
    const m = MODULOS[actual], modulo = actual;
    let datos = {};
    if (id) {
      const r = await api(`/${modulo}/${id}`);
      if (!r.ok) return aviso('error', 'No se pudo cargar', r.data.message || 'Error del servidor.');
      datos = r.data.data;
    }
    if (modulo === 'roles') MODULOS.roles.campos.find(c => c.k === 'alcance').op = config.alcances;
    let html = '';
    for (const c of m.campos) {
      const v = datos[c.k] !== undefined && datos[c.k] !== null ? datos[c.k] : (c.def !== undefined ? c.def : '');
      const idc = 'f_' + c.k;
      const lab = `<label for="${idc}" class="etiqueta">${esc(c.l)}${c.req ? ' *' : ''}</label>`;
      if (c.t === 'sel') {
        const ops = c.lookup ? (await lookup(c.lookup)).map(o => [o.id, o.nombre]) : c.op.map(o => [o, o]);
        html += `<div>${lab}<select id="${idc}" class="campo"><option value="">Seleccione...</option>${ops.map(([val, txt]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(txt)}</option>`).join('')}</select><p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'area') {
        html += `<div>${lab}<textarea id="${idc}" class="campo" rows="3" maxlength="${c.max}">${esc(v)}</textarea><p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'multi') {
        const sel = new Set((datos.delegaciones || []).map(Number));
        html += `<fieldset><legend class="etiqueta">${esc(c.l)}</legend><div class="grid grid-cols-1 sm:grid-cols-2 gap-1">${delegacionesPermitidas().map(d => `<label class="flex items-center gap-2 text-sm"><input type="checkbox" class="chk-del" value="${d.id}" ${sel.has(d.id) ? 'checked' : ''}> ${esc(d.codigo)} · ${esc(d.nombre)}</label>`).join('')}</div><p class="text-xs text-slate-500 mt-1">Solo puedes autorizar delegaciones que tú tienes autorizadas.</p></fieldset>`;
      } else if (c.t === 'clave') {
        html += `<div>${lab}<input id="${idc}" type="password" class="campo" autocomplete="new-password" maxlength="100" placeholder="${id ? 'Dejar vacío para no cambiarla' : 'Mínimo 8 caracteres, con letra y número'}"><p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'permisos') {
        html += `<div><span class="etiqueta">Permisos por módulo</span>${matrizPermisos(datos.permisos || {})}<p class="text-xs text-slate-500 mt-1">Solo puedes marcar permisos que tú tienes. Lo no marcado queda denegado.</p></div>`;
      } else {
        html += `<div>${lab}<input id="${idc}" type="${c.tipo || 'text'}" class="campo" maxlength="${c.max || 150}" value="${esc(v)}" ${c.ph ? `placeholder="${esc(c.ph)}"` : ''}><p class="error-campo" id="e_${c.k}"></p></div>`;
      }
    }

    const res = await Swal.fire({
      title: id ? `Editar ${m.singular}` : `Nuevo registro: ${m.singular}`,
      html: `<form id="swal-form" class="text-left space-y-3" novalidate>${html}</form>`,
      width: 640, showCancelButton: true, confirmButtonText: 'Guardar', cancelButtonText: 'Cancelar', confirmButtonColor: '#DB0032', focusConfirm: false,
      preConfirm: async () => {
        const body = {}, errores = {};
        for (const c of m.campos) {
          if (c.t === 'multi') { body.delegaciones = [...document.querySelectorAll('.chk-del:checked')].map(i => Number(i.value)); continue; }
          if (c.t === 'permisos') { body.permisos = leerPermisos($('swal-form')); continue; }
          const el = $('f_' + c.k); let val = el.value.trim();
          if (c.t === 'clave') { if (!val && id) continue; if (!val) { errores[c.k] = 'La contraseña es obligatoria.'; continue; } if (val.length < 8 || !/[A-Za-z]/.test(val) || !/\d/.test(val)) { errores[c.k] = 'Mínimo 8 caracteres, con al menos una letra y un número.'; continue; } body[c.k] = el.value; continue; }
          if (c.req && !val) { errores[c.k] = 'Este campo es obligatorio.'; continue; }
          if (c.tipo === 'email' && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { errores[c.k] = 'Ingresa un correo válido.'; continue; }
          if (c.t === 'sel' && c.lookup) val = val ? Number(val) : '';
          if (val !== '' || id) body[c.k] = val === '' ? null : val;
        }
        document.querySelectorAll('.error-campo').forEach(e => { e.textContent = ''; });
        document.querySelectorAll('.campo').forEach(e => e.classList.remove('invalido'));
        if (Object.keys(errores).length) {
          Object.entries(errores).forEach(([k, t]) => { $('e_' + k).textContent = t; $('f_' + k).classList.add('invalido'); });
          Swal.showValidationMessage('Revisa los campos marcados.');
          return false;
        }
        if (modulo === 'usuarios' && body.delegaciones && body.id_delegacion_activa && !body.delegaciones.includes(Number(body.id_delegacion_activa))) {
          body.delegaciones.push(Number(body.id_delegacion_activa));
        }
        const r = id ? await api(`/${modulo}/${id}`, { method: 'PUT', body }) : await api(`/${modulo}`, { method: 'POST', body });
        if (!r.ok) { Swal.showValidationMessage(r.data.message || 'No se pudo guardar.'); return false; }
        return r.data;
      }
    });
    if (res.isConfirmed) { toast('success', res.value.message || 'Guardado'); if (id === null) estadoLista.page = 1; cargarFilas(); }
  }

  // ── Vista de consulta (Ver) ────────────────────────────────────────────────
  async function detalle(id) {

      sub.innerHTML = lista.length ? '<option value="">Seleccione...</option>' + lista.map(s => `<option value="${s.id}">${esc(s.nombre)}</option>`).join('') : '<option value="">Este tipo no tiene sub atenciones activas</option>';
      sub.disabled = !lista.length;

      if (Object.keys(err).length) { aviso('warning', 'Revisa el formulario', 'Hay campos obligatorios o con formato incorrecto.'); return; }

      enviando = true; $('a_guardar').disabled = true;

      if (!r.ok) { aviso(r.status === 403 ? 'warning' : 'error', 'No se pudo guardar', r.data.message || 'Error del servidor.'); return; }

      f.reset();
      $('a_ident').value = `Último guardado: ${r.data.identificador || ''}`;
    });
  }

  // ── Inicio ─────────────────────────────────────────────────────────────────
  (async function iniciar() {
    // Se refresca el contexto desde el servidor: los permisos pueden haber cambiado desde el login.
    const me = await api('/auth/me');
    if (me.ok) { usuario = me.data.user; Sesion.actualizarUsuario(usuario); if (usuario.delegacionActiva) Sesion.fijarDelegacion(usuario.delegacionActiva.id); }
    else if (me.status === 403) { Sesion.cerrar(); await aviso('error', 'Acceso denegado', me.data.message); window.location.replace('/'); return; }
    const c = await api('/lookup/config');
    if (c.ok) config = c.data;
    pintarCabecera(); pintarMenu();
    abrir(primero());
  })();
  window.addEventListener('beforeunload', e => { if (sucio) { e.preventDefault(); e.returnValue = ''; } });
  </script>
</body>
</html>
