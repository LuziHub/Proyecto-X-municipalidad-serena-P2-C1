<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel SGR | Municipalidad de La Serena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/sgr.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">
  <header class="bg-muni-red text-white shadow-md border-b-4 border-amber-500">
    <div class="px-4 py-2.5 flex flex-wrap items-center gap-3">
      <div class="bg-white px-3 py-1.5 rounded-lg"><img src="/assets/horizontal-color.png" alt="Municipalidad de La Serena" class="h-9 w-auto" onerror="this.onerror=null;this.src='/assets/horizontal-color.svg';"></div>
      <p class="text-xs text-red-100 font-medium border-l border-white/30 pl-3 hidden sm:block">Sistema de Gestión y Registro (SGR)</p>
      <div class="ml-auto flex flex-wrap items-center gap-3">
        <div id="insignia" class="flex items-center gap-2 bg-white/15 border border-white/30 rounded-lg px-3 py-1.5 text-sm" title="Delegación en la que estás operando">
          <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
          <span class="sr-only">Delegación activa:</span>
          <strong id="del-nombre">—</strong>
          <select id="del-selector" class="hidden text-slate-800 rounded px-1 py-0.5 text-xs" aria-label="Cambiar de delegación"></select>
        </div>
        <div class="text-right leading-tight text-xs">
          <div class="font-bold" id="u-nombre"></div>
          <div class="text-red-100" id="u-rol"></div>
        </div>
        <button id="salir" class="btn btn-sec !py-1.5"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
      </div>
    </div>
  </header>

  <div class="flex flex-1 flex-col md:flex-row">
    <nav id="menu" class="md:w-60 bg-white border-r border-slate-200 p-3 flex md:flex-col gap-1 overflow-x-auto" aria-label="Módulos"></nav>
    <main id="contenido" class="flex-1 p-4 md:p-6 min-w-0" aria-live="polite"></main>
  </div>

  <script src="/sgr.js"></script>
  <script>
  const $ = id => document.getElementById(id);
  let usuario = Sesion.usuario();
  if (!Sesion.token() || !usuario) window.location.replace('/');

  // ── Definición de pantallas (qué columnas y campos tiene cada módulo) ──────
  const ESTADOS_ACTIVO = ['Activo', 'Inactivo'], ESTADOS_ACTIVA = ['Activa', 'Inactiva'];

    'atenciones': { etiqueta: 'Atenciones', icono: 'fa-clipboard-list', singular: 'atención',

    'tipos-atencion': { etiqueta: 'Tipo de Atención', icono: 'fa-tags', singular: 'tipo de atención', estados: ESTADOS_ACTIVO,

    'metas-cargo': { etiqueta: 'Metas por cargo', icono: 'fa-scale-balanced', singular: 'meta',
      columnas: [['periodo', 'Período'], ['cargo', 'Cargo'], ['item', 'Ítem'], ['ponderador', 'Ponderador', 'pct'], ['meta', 'Meta'], ['calculo', 'Cálculo']],

        { k: 'id_rol', l: 'Cargo (rol)', t: 'sel', lookup: 'cargos', req: 1 },

        { k: 'max_gestiones_dia', l: 'Máximo de gestiones por día', t: 'num', paso: '1', def: 7 },
        { k: 'cierre_dia_semana', l: 'Día de cierre de la semana anterior (1 = lunes … 7 = domingo)', t: 'num', paso: '1', def: 2 },
        { k: 'exigir_verificacion', l: 'Solo cuentan las gestiones con imagen verificada', t: 'chk' },

  async function abrir(id) {

    if (sucio) {

      sucio = false;
    }
    actual = id; marcarMenu(id);
    if (id === 'inicio') return pantallaInicio();
    if (id === 'ingreso') return pantallaIngreso();
    if (PLANTILLAS[id]) return pantallaPlantilla(id);
    if (PANTALLAS[id]) return PANTALLAS[id].abrir();
    estadoLista = { page: 1, search: '', estado: '' };

  // ── Listado ────────────────────────────────────────────────────────────────

    if (tipo === 'si') return `<span class="pastilla ${Number(v) ? 'p-ok' : 'p-off'}">${Number(v) ? 'Sí' : 'No'}</span>`;
    if (tipo === 'pct') return esc(pct(v));
    return esc(v === null || v === undefined || v === '' ? '—' : v);
  }

 <div id="kpis" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-3"></div>

      <div id="pag" class="flex items-center justify-between mt-3 text-sm"></div>`;

  async function cargarFilas() {
    const m = MODULOS[actual], modulo = actual;
    const q = new URLSearchParams({ page: estadoLista.page, limit: 10 });
    if (estadoLista.search) q.set('search', estadoLista.search);
    if (estadoLista.estado) q.set('estado', estadoLista.estado);
    const r = await api(`/${modulo}?${q}`);
    if (modulo !== actual || !$('tabla')) return;
    if (!r.ok) { $('tabla').innerHTML = `<p class="text-red-700"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(r.data.message || 'No se pudo cargar.')}</p>`; $('pag').innerHTML = ''; return; }

    if (!filas.length) {
      const filtrado = !!(estadoLista.search || estadoLista.estado);
      $('tabla').innerHTML = filtrado
        ? `<p class="text-slate-600 p-2"><i class="fa-solid fa-magnifying-glass"></i> Sin coincidencias${estadoLista.search ? ` para «${esc(estadoLista.search)}»` : ''}. Prueba con otros términos o quita los filtros.</p><button id="quitar-filtros" class="btn btn-sec mt-2">Quitar filtros</button>`
        : '<p class="text-slate-500 p-2"><i class="fa-regular fa-folder-open"></i> Aún no hay registros en este módulo.</p>';

      if ($('quitar-filtros')) $('quitar-filtros').addEventListener('click', () => { estadoLista = { page: 1, search: '', estado: '' }; listar(); });
      return;

    const acciones = true;
    $('tabla').className = '';
    $('tabla').innerHTML = `<table class="tabla w-full"><thead><tr>${m.columnas.map(c => `<th scope="col">${esc(c[1])}</th>`).join('')}${acciones ? '<th scope="col">Acciones</th>' : ''}</tr></thead><tbody>
      ${filas.map(f => `<tr>${m.columnas.map(c => `<td>${celda(f[c[0]], c[2])}</td>`).join('')}${acciones ? `<td class="whitespace-nowrap">

        ${puede(modulo, 'editar') && modulo !== 'atenciones' ? `<button class="btn btn-sec !py-1" data-edit="${f.id}" aria-label="Editar ${esc(f.nombre || f.correo || '')}"><i class="fa-solid fa-pen"></i> Editar</button>` : ''}
        ${modulo === 'gestiones' && puede('valoraciones', 'crear') && Number(f.id_responsable) !== Number(usuario.id) ? `<button class="btn btn-sec !py-1" data-verif="${f.id}" data-estado="${Number(f.imagen_verificada) ? 0 : 1}" title="La jefatura verifica la imagen de la gestión"><i class="fa-solid fa-circle-check ${Number(f.imagen_verificada) ? 'text-green-700' : ''}"></i> ${Number(f.imagen_verificada) ? 'Quitar verificación' : 'Verificar'}</button>` : ''}
        ${puede(modulo, 'eliminar') ? `<button class="btn btn-sec !py-1 text-red-700" data-del="${f.id}" aria-label="Eliminar ${esc(f.nombre || f.identificador_atencion || f.correo || '')}"><i class="fa-solid fa-trash"></i> Eliminar</button>` : ''}</td>` : ''}</tr>`).join('')}</tbody></table>`;
    $('tabla').querySelectorAll('[data-verif]').forEach(b => b.addEventListener('click', async () => {
      b.disabled = true;
      const x = await api(`/gestiones/${b.dataset.verif}/verificar`, { method: 'PUT', body: { verificada: b.dataset.estado === '1' } });
      if (x.ok) { toast('success', x.data.message); cargarFilas(); } else { aviso('error', 'No se pudo verificar', x.data.message); b.disabled = false; }
    }));
    $('tabla').querySelectorAll('[data-ver]').forEach(b => b.addEventListener('click', () => detalle(b.dataset.ver)));
    $('tabla').querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => formulario(b.dataset.edit)));
    $('tabla').querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => eliminar(b.dataset.del, filas.find(f => String(f.id) === b.dataset.del))));

    $('ant').addEventListener('click', () => { estadoLista.page -= 1; cargarFilas(); });

  async function resumenCartas() {
    const r = await api('/cartas/resumen');
    if (!r.ok || actual !== 'cartas' || !$('kpis')) return;
    const x = r.data.resumen;
    const kpi = (n, txt, color) => `<div class="kpi" style="border-left-color:${color}"><b>${n}</b><small>${txt}</small></div>`;
    $('kpis').innerHTML = kpi(x.total, 'Cartas en seguimiento', '#475569') + kpi(x.enProceso, 'En proceso', '#2563eb') + kpi(x.aprobadas, 'Aprobadas', '#f59e0b') + kpi(x.finalizadas, 'Finalizadas', '#16a34a');
  }
  async function exportar() {
    const b = $('exportar'); b.disabled = true;
    try {
      const q = new URLSearchParams();
      if (estadoLista.search) q.set('search', estadoLista.search);
      if (estadoLista.estado) q.set('estado', estadoLista.estado);
      const r = await fetch(`${API_URL}/${actual}/export?${q}`, { headers: { Authorization: `Bearer ${Sesion.token()}`, 'X-Delegacion': Sesion.delegacion() || '' } });
      if (!r.ok) { const d = await r.json().catch(() => ({})); aviso(r.status === 404 ? 'info' : 'error', r.status === 404 ? 'Sin datos' : 'No se pudo exportar', d.message || 'Error del servidor.'); return; }
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `${actual}_${new Date().toISOString().slice(0, 10)}.xlsx`;

  async function eliminar(id, fila) {
    const m = MODULOS[actual];
    const nombre = fila.nombre || fila.identificador_atencion || fila.correo || fila.codigo || fila.funcionario || `#${id}`;
    const c = await Swal.fire({ icon: 'warning', title: `¿Eliminar ${m.singular}?`, text: nombre, showCancelButton: true, confirmButtonText: 'Sí, eliminar', cancelButtonText: 'Cancelar', confirmButtonColor: '#DB0032' });
    if (!c.isConfirmed) return;
    const r = await api(`/${actual}/${id}`, { method: 'DELETE' });
    if (r.ok) { toast('success', 'Registro eliminado'); return cargarFilas(); }
    if (r.status === 409 && r.data.puedeDesactivar) {
      const d = await Swal.fire({ icon: 'info', title: 'No se puede eliminar', text: r.data.message, showCancelButton: true, confirmButtonText: 'Desactivar', cancelButtonText: 'Cancelar', confirmButtonColor: '#DB0032' });
      if (d.isConfirmed) {
        const inactivo = m.estados[1];
        const u = await api(`/${actual}/${id}`, { method: 'PUT', body: { estado: inactivo } });
        if (u.ok) { toast('success', 'Registro desactivado'); cargarFilas(); } else aviso('error', 'No se pudo desactivar', u.data.message);
      }
      return;
    }
    aviso(r.status === 403 ? 'warning' : 'error', 'No se pudo eliminar', r.data.message || 'Error del servidor.');
  }

  // ── Formularios ────────────────────────────────────────────────────────────
  const cache = {};
  async function lookup(nombre) {
    if (nombre === 'delegaciones') return usuario.delegaciones.map(d => ({ id: d.id, nombre: `${d.codigo} · ${d.nombre}` }));

    const r = await api(`/lookup/${nombre}`);
    if (r.ok && !['funcionarios', 'periodos', 'cargos', 'items'].includes(nombre)) cache[nombre] = r.data.data;
    return r.ok ? r.data.data : [];
  }
  const delegacionesPermitidas = () => usuario.delegaciones;

  function matrizPermisos(valor) {
    const mios = usuario.permisos || {};
    const nombres = config.modulos;
    const acciones = config.acciones;
    return `<div class="overflow-x-auto border border-slate-200 rounded-lg"><table class="tabla w-full"><thead><tr><th>Módulo</th>${acciones.map(a => `<th class="text-center">${esc(a)}</th>`).join('')}</tr></thead><tbody>
      ${Object.keys(nombres).map(mod => `<tr><td>${esc(nombres[mod])}</td>${acciones.map(a => {
        const tengo = (mios[mod] || []).includes(a), marcado = (valor[mod] || []).includes(a);
        return `<td class="text-center"><input type="checkbox" data-mod="${mod}" data-acc="${a}" ${marcado ? 'checked' : ''} ${tengo ? '' : 'disabled'} aria-label="${esc(nombres[mod])}: ${a}" ${tengo ? '' : 'title="No puedes otorgar un permiso que no tienes"'}></td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>`;

  function leerPermisos(raiz) {
    const p = {};

    return p;

  async function formulario(id) {
    const m = MODULOS[actual], modulo = actual;
    let datos = {};
    if (id) {
      const r = await api(`/${modulo}/${id}`);
      if (!r.ok) return aviso('error', 'No se pudo cargar', r.data.message || 'Error del servidor.');
      datos = r.data.data;
    }
    if (modulo === 'roles') MODULOS.roles.campos.find(c => c.k === 'alcance').op = config.alcances;
    // Registro de gestiones: se necesita el período vigente y la ventana de fechas que todavía se puede ingresar (regla 4)
    let vent = null;
    if (modulo === 'gestiones') {
      const v = await api('/lookup/items-mios');
      if (!v.ok) return aviso('error', 'No se pudo preparar el formulario', v.data.message || 'Error del servidor.');
      if (!v.data.periodo) return aviso('info', 'Sin período activo', 'No hay un período activo que incluya la fecha de hoy. Pídele a la Coordinación que lo cree.');
      if (!v.data.data.length) return aviso('info', 'Sin metas asignadas', 'Tu cargo no tiene ítems en este período. Pídele a la Coordinación que cargue las metas de tu cargo.');
      vent = v.data;
    }
    let html = '';
    for (const c of m.campos) {
      let v = datos[c.k] !== undefined && datos[c.k] !== null ? datos[c.k] : (c.def !== undefined ? c.def : '');
      if (v === 'HOY') v = vent ? vent.hoy : hoyLocal();
      const idc = 'f_' + c.k;
      const nota = c.nota ? `<p class="text-xs text-slate-500 mt-1">${esc(c.nota)}</p>` : '';
      const lab = `<label for="${idc}" class="etiqueta">${esc(c.l)}${c.req ? ' *' : ''}</label>`;
      if (c.t === 'org') {
        html += `<div>${lab}<input id="org_buscar" type="search" class="campo" list="org_lista" autocomplete="off" maxlength="100" value="${esc(datos.organizacion || '')}" placeholder="Buscar organización..."><datalist id="org_lista"></datalist><input type="hidden" id="${idc}" value="${esc(datos[c.k] || '')}">${nota}<p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'fecha') {
        const lim = vent && c.k === 'fecha_gestion' && !id ? ` min="${esc(vent.ventana.desde)}" max="${esc(vent.ventana.hasta)}"` : '';
        html += `<div>${lab}<input id="${idc}" type="date" class="campo" value="${esc(String(v).slice(0, 10))}"${lim}>${vent && c.k === 'fecha_gestion' ? `<p class="text-xs text-slate-500 mt-1">Puedes ingresar desde el ${esc(dia(vent.ventana.desde))} (las semanas se cierran el ${['', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'][vent.periodo.cierre_dia_semana]} siguiente). Máximo ${vent.periodo.max_gestiones_dia} gestiones por día.</p>` : ''}<p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'num') {
        html += `<div>${lab}<input id="${idc}" type="number" step="${c.paso || '1'}" class="campo" value="${esc(v)}"><p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'chk') {
        html += `<div><label class="flex items-start gap-2 text-sm"><input id="${idc}" type="checkbox" class="mt-1" ${Number(v) ? 'checked' : ''}> <span>${esc(c.l)}</span></label></div>`;
      } else if (c.t === 'sel') {
        const ops = c.lookup === 'items-mios' ? vent.data.map(o => [o.id, o.nombre]) : c.lookup ? (await lookup(c.lookup)).map(o => [o.id, o.nombre]) : c.op.map(o => [o, o]);
        html += `<div>${lab}<select id="${idc}" class="campo"><option value="">Seleccione...</option>${ops.map(([val, txt]) => `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(txt)}</option>`).join('')}</select><p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'area') {
        html += `<div>${lab}<textarea id="${idc}" class="campo" rows="3" maxlength="${c.max}">${esc(v)}</textarea>${nota}<p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'multi') {
        const sel = new Set((datos.delegaciones || []).map(Number));
        html += `<fieldset><legend class="etiqueta">${esc(c.l)}</legend><div class="grid grid-cols-1 sm:grid-cols-2 gap-1">${delegacionesPermitidas().map(d => `<label class="flex items-center gap-2 text-sm"><input type="checkbox" class="chk-del" value="${d.id}" ${sel.has(d.id) ? 'checked' : ''}> ${esc(d.codigo)} · ${esc(d.nombre)}</label>`).join('')}</div><p class="text-xs text-slate-500 mt-1">Solo puedes autorizar delegaciones que tú tienes autorizadas.</p></fieldset>`;
      } else if (c.t === 'clave') {
        html += `<div>${lab}<input id="${idc}" type="password" class="campo" autocomplete="new-password" maxlength="100" placeholder="${id ? 'Dejar vacío para no cambiarla' : 'Mínimo 8 caracteres, con letra y número'}"><p class="error-campo" id="e_${c.k}"></p></div>`;
      } else if (c.t === 'permisos') {
        html += `<div><span class="etiqueta">Permisos por módulo</span>${matrizPermisos(datos.permisos || {})}<p class="text-xs text-slate-500 mt-1">Solo puedes marcar permisos que tú tienes. Lo no marcado queda denegado.</p></div>`;
      } else {
        html += `<div>${lab}<input id="${idc}" type="${c.tipo || 'text'}" class="campo" maxlength="${c.max || 150}" value="${esc(v)}" ${c.ph ? `placeholder="${esc(c.ph)}"` : ''}>${nota}<p class="error-campo" id="e_${c.k}"></p></div>`;
      }
    }

    const res = await Swal.fire({
      title: id ? `Editar ${m.singular}` : `Nuevo registro: ${m.singular}`,
      html: `<form id="swal-form" class="text-left space-y-3" novalidate>${html}</form>`,
      width: 640, showCancelButton: true, confirmButtonText: 'Guardar', cancelButtonText: 'Cancelar', confirmButtonColor: '#DB0032', focusConfirm: false,
      didOpen: iniciarBuscadorOrg,
      preConfirm: async () => {
        const body = {}, errores = {};
        for (const c of m.campos) {
          if (c.t === 'multi') { body.delegaciones = [...document.querySelectorAll('.chk-del:checked')].map(i => Number(i.value)); continue; }
          if (c.t === 'permisos') { body.permisos = leerPermisos($('swal-form')); continue; }
          if (c.t === 'org') { const ido = $('f_' + c.k).value; if (ido) body[c.k] = Number(ido); else if (id) body[c.k] = null; continue; }
          const el = $('f_' + c.k);
          if (c.t === 'chk') { body[c.k] = el.checked ? 1 : 0; continue; }
          let val = el.value.trim();
          if (c.t === 'num') {
            if (val === '') { if (c.req) errores[c.k] = 'Este campo es obligatorio.'; continue; }
            if (!Number.isFinite(Number(val))) { errores[c.k] = 'Ingresa un número válido.'; continue; }
            body[c.k] = Number(val); continue;
          }
          if (c.t === 'clave') { if (!val && id) continue; if (!val) { errores[c.k] = 'La contraseña es obligatoria.'; continue; } if (val.length < 8 || !/[A-Za-z]/.test(val) || !/\d/.test(val)) { errores[c.k] = 'Mínimo 8 caracteres, con al menos una letra y un número.'; continue; } body[c.k] = el.value; continue; }
          if (c.req && !val) { errores[c.k] = 'Este campo es obligatorio.'; continue; }
          if (c.tipo === 'email' && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { errores[c.k] = 'Ingresa un correo válido.'; continue; }
          if (c.t === 'sel' && c.lookup) val = val ? Number(val) : '';
          if (val !== '' || id) body[c.k] = val === '' ? null : val;
        }
        document.querySelectorAll('.error-campo').forEach(e => { e.textContent = ''; });
        document.querySelectorAll('.campo').forEach(e => e.classList.remove('invalido'));
        if (Object.keys(errores).length) {
          Object.entries(errores).forEach(([k, t]) => { $('e_' + k).textContent = t; $('f_' + k).classList.add('invalido'); });
          Swal.showValidationMessage('Revisa los campos marcados.');
          return false;
        }
        if (modulo === 'usuarios' && body.delegaciones && body.id_delegacion_activa && !body.delegaciones.includes(Number(body.id_delegacion_activa))) {
          body.delegaciones.push(Number(body.id_delegacion_activa));
        }
        const r = id ? await api(`/${modulo}/${id}`, { method: 'PUT', body }) : await api(`/${modulo}`, { method: 'POST', body });
        if (!r.ok) { Swal.showValidationMessage(r.data.message || 'No se pudo guardar.'); return false; }
        return r.data;
      }
    });
    if (res.isConfirmed) {
      toast('success', res.value.message || 'Guardado');
      if (id === null) estadoLista.page = 1;
      recargar();
      if (res.value.aviso) aviso('warning', `La gestión ${res.value.codigo || ''} se guardó, pero no puntúa`, res.value.aviso);
      else if (res.value.tubo) toast('info', `Ingresada al tubo como ${res.value.tubo}`);
    }
  }
  // Buscador de organizaciones: consulta al servidor a medida que se escribe y completa solicitante y territorio.
  function iniciarBuscadorOrg() {
    const caja = $('org_buscar');
    if (!caja) return;
    let t, opciones = [];
    caja.addEventListener('input', () => {
      const elegida = opciones.find(o => o.nombre === caja.value);
      if (elegida) {
        $('f_id_organizacion').value = elegida.id;
        if ($('f_solicitante')) $('f_solicitante').value = elegida.nombre;
        if ($('f_territorio') && elegida.territorio) $('f_territorio').value = elegida.territorio;
        return;
      }
      $('f_id_organizacion').value = '';
      clearTimeout(t);
      if (caja.value.trim().length < 2) return;
      t = setTimeout(async () => {
        const r = await api(`/lookup/organizaciones?q=${encodeURIComponent(caja.value.trim())}`);
        if (!r.ok) return;
        opciones = r.data.data;
        $('org_lista').innerHTML = opciones.map(o => `<option value="${esc(o.nombre)}">${esc(o.territorio || '')}</option>`).join('');
      }, 250);
    });
  }
  const recargar = () => (actual === 'tubo' ? pantallaTubo() : (actual === 'cartas' && resumenCartas(), cargarFilas()));

  // ── Vista de consulta (Ver) ────────────────────────────────────────────────
  async function detalle(id) {
    const modulo = actual, m = MODULOS[modulo];
    const r = await api(`/${modulo}/${id}`);
    if (!r.ok) return aviso(r.status === 404 ? 'info' : 'error', 'No se pudo cargar', r.data.message || 'Error del servidor.');
    const d = r.data.data;
    const valor = (k, tipo) => {
      const v = d[k];
      if (tipo === 'fecha') return esc(fechaHora(v));
      if (tipo === 'dia') return esc(dia(v));
      if (tipo === 'si') return Number(v) ? 'Sí' : 'No';
      if (tipo === 'pct') return esc(pct(v));
      if (tipo === 'permisos') {
        const p = v || {}, mods = Object.keys(p);
        return mods.length ? `<ul class="list-disc pl-5">${mods.map(x => `<li>${esc(config.modulos[x] || x)}: ${esc(p[x].join(', '))}</li>`).join('')}</ul>` : 'Sin permisos';
      }
      if (tipo === 'delegaciones') {
        const nombres = (v || []).map(i => { const x = usuario.delegaciones.find(z => z.id === i); return x ? `${x.codigo} · ${x.nombre}` : `#${i}`; });
        return nombres.length ? esc(nombres.join(', ')) : '—';
      }
      return esc(v === null || v === undefined || v === '' ? '—' : v);
    };
    await Swal.fire({
      title: `Detalle: ${m.singular}`,
      html: `<dl class="text-left grid grid-cols-1 sm:grid-cols-3 gap-x-3 gap-y-2">${VER[modulo].map(([k, l, t]) => `<dt class="etiqueta sm:col-span-1 !mb-0">${esc(l)}</dt><dd class="sm:col-span-2 text-sm">${valor(k, t)}</dd>`).join('')}</dl>`,
      width: 640, confirmButtonText: 'Cerrar', confirmButtonColor: '#DB0032'
    });
  }

  // ── Matriz SGR: mi puntaje y semáforo ───────────────────────────────────────
  const COLOR_SEM = { Verde: 'border-green-500', Naranjo: 'border-orange-400', Rojo: 'border-red-500' };
  function tarjetaPuntaje(r) {
    const total = r.total || 0, obj = (r.objetivo && r.objetivo.objetivo) || 0;
    const ancho = Math.min(100, total * 100);
    return `<div class="bg-white rounded-xl border-l-8 ${COLOR_SEM[r.semaforo] || 'border-slate-300'} shadow-sm border border-slate-200 p-4">
      <div class="flex flex-wrap items-center gap-3">
        <span class="sem sem-${esc(r.semaforo)}">${esc(r.semaforo)}</span>
        <div><div class="text-3xl font-extrabold">${esc(pct(total))}</div><div class="text-xs text-slate-500">Puntaje del período (mínimo esperado ${esc(pct(r.periodo.minimo_cumplimiento))})</div></div>
        <div class="ml-auto text-right text-sm"><div class="font-bold">Objetivo de hoy: ${esc(pct(obj))}</div>
          <div class="text-xs text-slate-500">${r.objetivo.diasNetos} de ${r.objetivo.diasPeriodo} días${r.objetivo.diasAusencia ? ` (${r.objetivo.diasAusencia} de ausencia descontados)` : ''}</div></div>
      </div>
      <div class="barra mt-3" role="img" aria-label="Puntaje ${esc(pct(total))}, objetivo ${esc(pct(obj))}"><span style="width:${ancho}%"></span><i style="left:${Math.min(100, obj * 100)}%"></i></div>
      <p class="text-xs text-slate-500 mt-1">La línea oscura marca el objetivo de hoy. Verde: llegas al objetivo. Naranjo: al menos 60 % de él. Rojo: menos.</p>
    </div>`;
  }
  function tablaItems(r) {
    const fila = i => `<tr><td>${esc(i.item)}${i.topado ? ' <span class="pastilla p-off" title="Tope por ítem aplicado">tope</span>' : ''}</td>
      <td class="text-right">${i.calculo === 'emergencia' ? 'las que ocurran' : i.calculo === 'tubo' ? esc(pct(i.meta)) : esc(i.meta)}</td>
      <td class="text-right">${i.calculo === 'tubo' ? esc(pct(i.avance)) : esc(i.avance)}</td>
      <td class="text-right">${esc(pct(i.pctTopado))}</td><td class="text-right">${esc(pct(i.ponderador))}</td><td class="text-right font-bold">${esc(pct(i.ponderado))}</td></tr>`;
    return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto mt-4"><table class="tabla w-full"><thead><tr><th>Ítem</th><th class="text-right">Meta</th><th class="text-right">Avance</th><th class="text-right">Cumplimiento</th><th class="text-right">Ponderador</th><th class="text-right">Puntaje</th></tr></thead><tbody>
      ${r.items.map(fila).join('')}
      <tr><td colspan="5" class="text-right">Felicitaciones (${r.felicitaciones.contadas} de ${r.felicitaciones.cantidad})</td><td class="text-right">+${esc(pct(r.felicitaciones.puntos))}</td></tr>
      <tr><td colspan="5" class="text-right">Reclamos (${r.reclamos.cantidad})</td><td class="text-right">${esc(pct(r.reclamos.puntos))}</td></tr>
      <tr><td colspan="5" class="text-right font-bold">Total${r.topadoTotal ? ' (con tope por colaborador)' : ''}</td><td class="text-right font-extrabold">${esc(pct(r.total))}</td></tr></tbody></table></div>
      ${r.advertencias.map(a => `<p class="text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-2 mt-2"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(a)}</p>`).join('')}`;
  }

  async function pantallaSemaforo() {
    const cont = $('contenido');
    cont.innerHTML = '<p class="text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> Calculando...</p>';
    const r = await api('/semaforo');
    if (actual !== 'semaforo') return;
    if (!r.ok) { cont.innerHTML = `<p class="text-red-700"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(r.data.message || 'No se pudo calcular.')}</p>`; return; }
    const d = r.data;
    const cab = `<h1 class="text-xl font-bold mb-4"><i class="fa-solid fa-traffic-light text-red-700"></i> Mi puntaje y semáforo</h1>`;
    if (!d.periodo) { cont.innerHTML = cab + '<p class="bg-white rounded-xl border p-4">No hay un período activo para la fecha de hoy.</p>'; return; }
    if (!d.tieneMetas) { cont.innerHTML = cab + `<p class="bg-white rounded-xl border p-4">Tu cargo no tiene metas cargadas en «${esc(d.periodo.nombre)}». La Coordinación puede cargarlas en «Metas por cargo».</p>`; return; }
    const g = d.gestiones;
    cont.innerHTML = `${cab}<p class="text-sm text-slate-600 mb-3">${esc(d.usuario.nombre)} · ${esc(d.usuario.rol)} · ${esc(d.periodo.nombre)} (${esc(dia(d.periodo.fecha_inicio))} al ${esc(dia(d.periodo.fecha_fin))})</p>
      ${tarjetaPuntaje(d)}
      ${d.periodo.exigir_verificacion ? '<p class="text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-2 mt-3"><i class="fa-solid fa-circle-info"></i> En este período solo cuentan las gestiones con imagen verificada por la jefatura.</p>' : ''}
      <p class="text-sm mt-3">${g.total} gestión(es) registradas${g.ultima ? ` · última el ${esc(dia(g.ultima))}${g.diasSinIngreso > 2 ? ` (${g.diasSinIngreso} días sin ingresar)` : ''}` : ''}${d.tubo.total ? ` · tubo: ${d.tubo.realizadas} de ${d.tubo.total} realizadas` : ''}.</p>
      ${tablaItems(d)}`;
  }

  // ── Matriz SGR: equipo de la delegación ─────────────────────────────────────
  async function pantallaEquipo() {
    const cont = $('contenido');
    cont.innerHTML = '<p class="text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> Calculando...</p>';
    const r = await api('/semaforo/equipo');
    if (actual !== 'equipo') return;
    const cab = `<div class="flex flex-wrap items-center gap-2 mb-4"><h1 class="text-xl font-bold mr-auto"><i class="fa-solid fa-people-group text-red-700"></i> Equipo de la delegación</h1>
      ${puede('equipo', 'ver') ? '<button id="exp-equipo" class="btn btn-sec"><i class="fa-solid fa-file-excel text-green-700"></i> Exportar a Excel</button>' : ''}</div>`;
    if (!r.ok) { cont.innerHTML = cab + `<p class="text-red-700"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(r.data.message || 'No se pudo calcular.')}</p>`; return; }
    const d = r.data;
    if (!d.periodo) { cont.innerHTML = cab + '<p class="bg-white rounded-xl border p-4">No hay un período activo para la fecha de hoy.</p>'; return; }
    window.__equipo = d.filas;
    cont.innerHTML = `${cab}<p class="text-sm text-slate-600 mb-3">${esc(d.periodo.nombre)} · al ${esc(dia(d.hoy))}</p>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"><table class="tabla w-full"><thead><tr><th>Funcionario</th><th>Cargo</th><th class="text-right">Puntaje</th><th class="text-right">Objetivo</th><th>Semáforo</th><th class="text-right">Gestiones</th><th>Última</th><th></th></tr></thead><tbody>
      ${d.filas.map((f, i) => f.tieneMetas
        ? `<tr><td>${esc(f.usuario.nombre)}</td><td>${esc(f.usuario.rol)}</td><td class="text-right font-bold">${esc(pct(f.total))}</td><td class="text-right">${esc(pct(f.objetivo.objetivo))}</td><td><span class="sem sem-${esc(f.semaforo)}">${esc(f.semaforo)}</span></td><td class="text-right">${f.gestiones.total}</td><td>${esc(dia(f.gestiones.ultima))}</td><td><button class="btn btn-sec !py-1" data-det="${i}"><i class="fa-regular fa-eye"></i> Detalle</button></td></tr>`
        : `<tr><td>${esc(f.usuario.nombre)}</td><td>${esc(f.usuario.rol)}</td><td colspan="6" class="text-slate-500">Sin metas en este período</td></tr>`).join('')}
      </tbody></table></div>`;
    cont.querySelectorAll('[data-det]').forEach(b => b.addEventListener('click', () => {
      const f = window.__equipo[Number(b.dataset.det)];
      Swal.fire({ title: esc(f.usuario.nombre), html: `<div class="text-left">${tarjetaPuntaje(f)}${tablaItems(f)}</div>`, width: 860, confirmButtonText: 'Cerrar', confirmButtonColor: '#DB0032' });
    }));
    if ($('exp-equipo')) $('exp-equipo').addEventListener('click', () => descargar('/semaforo/equipo/export', `equipo_${hoyLocal()}.xlsx`, $('exp-equipo')));
  }
  async function descargar(ruta, nombre, boton) {
    if (boton) boton.disabled = true;
    try {
      const r = await fetch(API_URL + ruta, { headers: { Authorization: `Bearer ${Sesion.token()}`, 'X-Delegacion': Sesion.delegacion() || '' } });
      if (!r.ok) { const d = await r.json().catch(() => ({})); aviso(r.status === 404 ? 'info' : 'error', r.status === 404 ? 'Sin datos' : 'No se pudo exportar', d.message || 'Error del servidor.'); return; }
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
      toast('success', 'Archivo Excel generado');
    } finally { if (boton) boton.disabled = false; }
  }

  // ── Matriz SGR: tubo de trabajo (tablero) ───────────────────────────────────
  let soloMias = false;
  const SIGUIENTE_TXT = { 'Pendiente': 'A pendiente', 'En proceso': 'A en proceso', 'Realizado': 'Marcar realizada' };
  function tarjetaTubo(t) {
    return `<article class="tarjeta ${t.estado === 'Realizado' ? 'hecha' : ''}">
      <div class="flex justify-between gap-2"><span class="cod">${esc(t.codigo)}</span><span class="pastilla ${t.ambito === 'EXT' ? 'p-off' : 'p-ok'}">${t.ambito === 'EXT' ? 'Externo' : 'Interno'}</span></div>
      <p class="titulo font-semibold mt-1">${esc(t.titulo)}</p>
      <p class="meta mt-1">${t.codigo_gestion ? `Gestión ${esc(t.codigo_gestion)} · ` : ''}Solicita: ${esc(t.solicitante)}${t.territorio ? ` (${esc(t.territorio)})` : ''}</p>
      ${t.area_apoyo ? `<p class="meta">Apoyo: ${esc(t.area_apoyo)}</p>` : ''}
      <p class="meta">Responsable: ${esc(t.responsable)}</p>
      <p class="meta">Ingresó ${esc(dia(t.fecha_solicitud))}${t.fecha_compromiso ? ` · compromiso ${esc(dia(t.fecha_compromiso))}` : ''}${t.fecha_realizado ? ` · realizada ${esc(dia(t.fecha_realizado))}` : ''}</p>
      ${t.avance ? `<p class="meta italic">${esc(t.avance)}</p>` : ''}
      <div class="flex flex-wrap gap-1 mt-2">
        ${t.puedeAvanzar ? `<button class="btn btn-primario !py-1 !text-xs" data-avanzar="${t.id}" data-sig="${esc(t.siguiente)}">${esc(SIGUIENTE_TXT[t.siguiente])}</button>` : ''}
        ${puede('tubo', 'editar') && t.estado !== 'Realizado' ? `<button class="btn btn-sec !py-1 !text-xs" data-editar-tubo="${t.id}"><i class="fa-solid fa-pen"></i> Editar</button>` : ''}
        <button class="btn btn-sec !py-1 !text-xs" data-ver-tubo="${t.id}"><i class="fa-regular fa-eye"></i> Ver</button>
      </div></article>`;
  }
  async function pantallaTubo() {
    const cont = $('contenido');
    if (!$('tablero-tubo')) cont.innerHTML = '<p class="text-slate-500"><i class="fa-solid fa-spinner fa-spin"></i> Cargando tablero...</p>';
    const r = await api(`/tubo/tablero${soloMias ? '?mias=1' : ''}`);
    if (actual !== 'tubo') return;
    if (!r.ok) { cont.innerHTML = `<p class="text-red-700"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(r.data.message || 'No se pudo cargar el tubo.')}</p>`; return; }
    const k = r.data.indicadores, col = r.data.columnas;
    const kpi = (n, txt, color, sub) => `<div class="kpi" style="border-left-color:${color}"><b>${n}</b><small>${txt}</small>${sub ? `<div class="text-xs text-slate-500">${sub}</div>` : ''}</div>`;
    cont.innerHTML = `<div class="flex flex-wrap items-center gap-2 mb-4">
        <h1 class="text-xl font-bold mr-auto"><i class="fa-solid fa-diagram-project text-red-700"></i> Tubo de trabajo</h1>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="solo-mias" ${soloMias ? 'checked' : ''}> Solo mis gestiones</label>
        ${puede('tubo', 'exportar') ? '<button id="exp-tubo" class="btn btn-sec"><i class="fa-solid fa-file-excel text-green-700"></i> Exportar a Excel</button>' : ''}
        ${puede('tubo', 'crear') ? '<button id="nuevo-tubo" class="btn btn-primario"><i class="fa-solid fa-plus"></i> Nueva gestión</button>' : ''}</div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
        ${kpi(k.total, 'Gestiones en tubo', '#475569', `${k.ingresadas} recién ingresada(s)`)}
        ${kpi(k.realizadas, 'Realizadas', '#16a34a', `${String(k.tasaResolucion).replace('.', ',')} % de resolución`)}
        ${kpi(k.enProceso, 'En proceso', '#2563eb', 'trabajo activo')}
        ${kpi(k.pendientes, 'Pendientes', '#f59e0b', 'requieren atención')}
      </div>
      <div class="tablero" id="tablero-tubo">${['Ingresado', 'Pendiente', 'En proceso', 'Realizado'].map(e => `<section class="columna" aria-label="${e}"><h2><span>${e}</span><span>${col[e].length}</span></h2>${col[e].length ? col[e].map(tarjetaTubo).join('') : '<p class="text-xs text-slate-500">Sin gestiones.</p>'}</section>`).join('')}</div>`;
    $('solo-mias').addEventListener('change', e => { soloMias = e.target.checked; pantallaTubo(); });
    if ($('nuevo-tubo')) $('nuevo-tubo').addEventListener('click', () => formulario(null));
    if ($('exp-tubo')) $('exp-tubo').addEventListener('click', () => descargar('/tubo/export', `tubo_${hoyLocal()}.xlsx`, $('exp-tubo')));
    cont.querySelectorAll('[data-editar-tubo]').forEach(b => b.addEventListener('click', () => formulario(b.dataset.editarTubo)));
    cont.querySelectorAll('[data-ver-tubo]').forEach(b => b.addEventListener('click', () => detalle(b.dataset.verTubo)));
    cont.querySelectorAll('[data-avanzar]').forEach(b => b.addEventListener('click', async () => {
      b.disabled = true;
      const x = await api(`/tubo/${b.dataset.avanzar}/estado`, { method: 'PUT', body: { estado: b.dataset.sig } });
      if (x.ok) { toast('success', x.data.message); pantallaTubo(); } else { aviso('error', 'No se pudo cambiar el estado', x.data.message); b.disabled = false; }
    }));
  }

  // ── Inicio: contexto del usuario y matriz de permisos de su rol ─────────────
  function pantallaInicio() {
    const act = usuario.delegacionActiva;
    const nombres = config.modulos || {};
    const acciones = config.acciones || [];
    const plantilla = new Set(config.plantillas || []);
    const si = '<span class="text-green-700" title="Permitido"><i class="fa-solid fa-circle-check" aria-hidden="true"></i><span class="sr-only">Sí</span></span>';
    const no = '<span class="text-slate-400" title="No permitido"><i class="fa-solid fa-minus" aria-hidden="true"></i><span class="sr-only">No</span></span>';
    $('contenido').innerHTML = `
      <h1 class="text-xl font-bold mb-1"><i class="fa-solid fa-house text-red-700" aria-hidden="true"></i> Inicio</h1>
      <p class="text-slate-600 mb-4">Bienvenido/a, <strong>${esc(usuario.nombre)}</strong>. Este es tu contexto de trabajo y lo que tu rol te permite hacer.</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-5">
        <div class="bg-white rounded-xl border border-slate-200 p-4"><div class="etiqueta">Rol</div><div class="font-semibold">${esc(usuario.rol)}</div><div class="text-xs text-slate-500">Alcance: ${esc(usuario.alcance)}</div></div>
        <div class="bg-white rounded-xl border border-slate-200 p-4"><div class="etiqueta">Delegación activa</div><div class="font-semibold"><i class="fa-solid fa-location-dot text-red-700" aria-hidden="true"></i> ${act ? esc(act.codigo + ' · ' + act.nombre) : 'Sin delegación'}</div><div class="text-xs text-slate-500">${usuario.delegaciones.length > 1 ? 'Puedes cambiarla desde la cabecera.' : 'Tu contexto es fijo.'}</div></div>
        <div class="bg-white rounded-xl border border-slate-200 p-4"><div class="etiqueta">Delegaciones autorizadas</div><div class="text-sm">${usuario.delegaciones.map(d => esc(d.codigo + ' · ' + d.nombre)).join('<br>') || '—'}</div></div>
      </div>
      <h2 class="font-bold mb-2">Permisos de tu rol por módulo</h2>
      <div class="bg-white rounded-xl border border-slate-200 overflow-x-auto"><table class="tabla w-full">
        <thead><tr><th scope="col">Módulo</th>${acciones.map(a => `<th scope="col" class="text-center">${esc(a)}</th>`).join('')}</tr></thead>
        <tbody>${Object.keys(nombres).map(mod => `<tr><th scope="row" class="!bg-white !normal-case !text-slate-800 !text-sm font-semibold">${esc(nombres[mod])}${plantilla.has(mod) ? ' <span class="pastilla p-off">plantilla</span>' : ''}</th>${acciones.map(a => `<td class="text-center">${puede(mod, a) ? si : no}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="text-xs text-slate-500 mt-2">El menú solo muestra los módulos con permiso de «ver». Los permisos se validan en el servidor en cada solicitud. Los módulos marcados como «plantilla» muestran datos ilustrativos y aún no tienen lógica.</p>`;
  }

  // ── Módulos pendientes: plantilla de interfaz (sin lógica ni persistencia) ──
  function pantallaPlantilla(id) {
    const t = PLANTILLAS[id];
    const pendiente = () => Swal.fire({ icon: 'info', title: 'Función simulada', text: 'Este módulo es una plantilla de interfaz. Esta acción se habilitará cuando se implemente su lógica; por ahora no guarda datos.', confirmButtonText: 'Entendido', confirmButtonColor: '#DB0032' });
    $('contenido').innerHTML = `
      <div class="flex items-start gap-3 bg-amber-50 border border-amber-300 text-amber-900 rounded-lg px-4 py-3 mb-4" role="note">
        <i class="fa-solid fa-triangle-exclamation mt-0.5" aria-hidden="true"></i>
        <div><strong>Plantilla de interfaz · lógica pendiente.</strong> Los datos son ilustrativos y las acciones no guardan información.</div>
      </div>
      <div class="flex flex-wrap items-center gap-2 mb-1">
        <h1 class="text-xl font-bold mr-auto"><i class="fa-solid ${t.icono} text-red-700" aria-hidden="true"></i> ${esc(t.titulo)}</h1>
        <button class="btn btn-sec" data-pend><i class="fa-solid fa-file-excel text-green-700"></i> Exportar a Excel</button>
        <button class="btn btn-primario" data-pend><i class="fa-solid fa-plus"></i> Nuevo registro</button>
      </div>
      <p class="text-slate-600 mb-3">${esc(t.texto)}</p>
      <input class="campo !w-64 mb-3" placeholder="Buscar..." aria-label="Buscar (simulado)" data-pend readonly>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto"><table class="tabla w-full">
        <thead><tr>${t.cols.map(c => `<th scope="col">${esc(c)}</th>`).join('')}<th scope="col">Acciones</th></tr></thead>
        <tbody>${t.filas.map(f => `<tr>${f.map(c => `<td>${esc(c)}</td>`).join('')}<td class="whitespace-nowrap"><button class="btn btn-sec !py-1" data-pend><i class="fa-regular fa-eye"></i> Ver</button> <button class="btn btn-sec !py-1" data-pend><i class="fa-solid fa-pen"></i> Editar</button></td></tr>`).join('')}</tbody></table></div>
      <p class="text-xs text-slate-500 mt-2">Datos ilustrativos · Acciones sujetas al perfil (${esc(usuario.rol)}: solo consulta de esta plantilla).</p>`;
    $('contenido').querySelectorAll('[data-pend]').forEach(el => { el.addEventListener('click', pendiente); });
  }

  // ── Ingreso de atención ────────────────────────────────────────────────────
  async function pantallaIngreso() {
    const cont = $('contenido');
    const act = usuario.delegacionActiva;
    const tipos = await lookup('tipos');
    cont.innerHTML = `
      <h1 class="text-xl font-bold mb-4"><i class="fa-solid fa-pen-to-square text-red-700" aria-hidden="true"></i> Ingreso de atención</h1>
      <form id="f-atencion" novalidate class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl">
        <div class="md:col-span-2"><label for="a_solicitante" class="etiqueta">Vecino o solicitante *</label><input id="a_solicitante" class="campo" maxlength="150" autocomplete="off" placeholder="Nombre completo del solicitante"><p class="error-campo" id="ea_solicitante"></p></div>
        <div><label for="a_tipo" class="etiqueta">Tipo de atención *</label><select id="a_tipo" class="campo"><option value="">Seleccione...</option>${tipos.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}</select><p class="error-campo" id="ea_tipo"></p></div>
        <div><label for="a_sub" class="etiqueta">Sub atención *</label><select id="a_sub" class="campo" disabled><option value="">Primero elija un tipo</option></select><p class="error-campo" id="ea_sub"></p></div>
        <div class="md:col-span-2"><label for="a_desc" class="etiqueta">Descripción *</label><textarea id="a_desc" class="campo" rows="4" maxlength="2000"></textarea><p class="error-campo" id="ea_desc"></p></div>
        <div><label class="etiqueta" for="a_del">Delegación</label><input id="a_del" class="campo" readonly value="${esc(act.codigo + ' · ' + act.nombre)}"></div>
        <div><label class="etiqueta" for="a_resp">Responsable</label><input id="a_resp" class="campo" readonly value="${esc(usuario.nombre)}"></div>
        <div><label class="etiqueta" for="a_fecha">Fecha de registro</label><input id="a_fecha" class="campo" readonly value="Se asigna automáticamente al guardar"></div>
        <div><label class="etiqueta" for="a_ident">Identificador</label><input id="a_ident" class="campo" readonly value="Se genera al guardar"></div>
        <div class="md:col-span-2 flex gap-2 justify-end"><button type="button" id="a_cancelar" class="btn btn-sec">Cancelar</button><button type="reset" id="a_limpiar" class="btn btn-sec">Limpiar</button><button type="submit" id="a_guardar" class="btn btn-primario"><i class="fa-solid fa-floppy-disk"></i> Guardar atención</button></div>
      </form>`;
    const f = $('f-atencion');
    f.addEventListener('input', () => { sucio = true; });
    f.addEventListener('reset', () => { sucio = false; $('a_sub').disabled = true; $('a_sub').innerHTML = '<option value="">Primero elija un tipo</option>'; document.querySelectorAll('.error-campo').forEach(e => { e.textContent = ''; }); });

    $('a_tipo').addEventListener('change', async e => {
      const sub = $('a_sub');
      sub.innerHTML = '<option value="">Cargando...</option>'; sub.disabled = true;
      if (!e.target.value) { sub.innerHTML = '<option value="">Primero elija un tipo</option>'; return; }
      const r = await api(`/lookup/subatenciones?tipo=${encodeURIComponent(e.target.value)}`);
      const lista = r.ok ? r.data.data : [];
      sub.innerHTML = lista.length ? '<option value="">Seleccione...</option>' + lista.map(s => `<option value="${s.id}">${esc(s.nombre)}</option>`).join('') : '<option value="">Este tipo no tiene sub atenciones activas</option>';
      sub.disabled = !lista.length;
    });

    // Cancelar no crea ningún registro: descarta lo escrito y vuelve al listado (o al inicio).
    $('a_cancelar').addEventListener('click', async () => {
      if (sucio) {
        const c = await Swal.fire({ icon: 'question', title: '¿Cancelar el ingreso?', text: 'Se descartará lo que escribiste. No se creará ningún registro.', showCancelButton: true, confirmButtonText: 'Sí, cancelar', cancelButtonText: 'Seguir editando', confirmButtonColor: '#DB0032' });
        if (!c.isConfirmed) return;
      }
      sucio = false;
      abrir(puede('atenciones', 'ver') ? 'atenciones' : 'inicio');
    });

    let enviando = false;
    f.addEventListener('submit', async e => {
      e.preventDefault();
      if (enviando) return;
      const v = { solicitante: $('a_solicitante').value.trim(), tipo: $('a_tipo').value, sub: $('a_sub').value, desc: $('a_desc').value.trim() };
      const err = {};
      if (v.solicitante.length < 3) err.solicitante = 'Ingresa el nombre del solicitante (mínimo 3 caracteres).';
      else if (!/^[\p{L} .'\-]+$/u.test(v.solicitante)) err.solicitante = 'Solo letras, espacios, punto, apóstrofo y guion.';
      if (!v.tipo) err.tipo = 'Selecciona un tipo de atención.';
      if (!v.sub) err.sub = 'Selecciona una sub atención.';
      if (v.desc.length < 5) err.desc = 'Describe la atención (mínimo 5 caracteres).';
      else if (/[<>]/.test(v.desc)) err.desc = 'La descripción no puede contener los símbolos < o >.';
      ['solicitante', 'tipo', 'sub', 'desc'].forEach(k => { $('ea_' + k).textContent = err[k] || ''; $('a_' + k).classList.toggle('invalido', !!err[k]); });
      if (Object.keys(err).length) { aviso('warning', 'Revisa el formulario', 'Hay campos obligatorios o con formato incorrecto.'); return; }

      enviando = true; $('a_guardar').disabled = true;
      const r = await api('/atenciones', { method: 'POST', body: { solicitante: v.solicitante, id_tipo: Number(v.tipo), id_sub_atencion: Number(v.sub), descripcion: v.desc } });
      enviando = false; $('a_guardar').disabled = false;
      if (!r.ok) { aviso(r.status === 403 ? 'warning' : 'error', 'No se pudo guardar', r.data.message || 'Error del servidor.'); return; }
      sucio = false;
      $('a_ident').value = r.data.identificador || '';
      await Swal.fire({ icon: 'success', title: 'Atención registrada', html: `Identificador asignado:<br><strong style="font-size:1.4rem">${esc(r.data.identificador || '')}</strong>`, confirmButtonColor: '#DB0032' });
      f.reset();
      $('a_ident').value = `Último guardado: ${r.data.identificador || ''}`;
    });
  }

  // ── Inicio ─────────────────────────────────────────────────────────────────
  (async function iniciar() {
    // Se refresca el contexto desde el servidor: los permisos pueden haber cambiado desde el login.
    const me = await api('/auth/me');
    if (me.ok) { usuario = me.data.user; Sesion.actualizarUsuario(usuario); if (usuario.delegacionActiva) Sesion.fijarDelegacion(usuario.delegacionActiva.id); }
    else if (me.status === 403) { Sesion.cerrar(); await aviso('error', 'Acceso denegado', me.data.message); window.location.replace('/'); return; }
    const c = await api('/lookup/config');
    if (c.ok) config = c.data;
    pintarCabecera(); pintarMenu();
    abrir(primero());
  })();
  window.addEventListener('beforeunload', e => { if (sucio) { e.preventDefault(); e.returnValue = ''; } });
  </script>
</body>
</html>
